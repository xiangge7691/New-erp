<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>仓储扫码 · PC 端原型</title>
<style>
:root{
  --primary:#2f6fed; --primary-weak:#eaf1ff; --primary-dark:#1f5bd7;
  --green:#079455; --green-weak:#e7f6ee;
  --amber:#dc6803; --amber-weak:#fef4e6;
  --red:#d92d20; --red-weak:#fdeceb;
  --text:#182230; --muted:#667085; --soft:#98a2b3;
  --line:#e4e7ec; --line2:#eef1f5; --bg:#f5f7fb; --card:#fff;
  --radius:14px; --radius-sm:9px;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 10px 28px rgba(16,24,40,.05);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--text);
  font:13px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#d6dce6;border-radius:4px}

/* ---------- 布局 ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  position:fixed;inset:0 auto 0 0;width:222px;background:#fff;
  border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:10;
}
.brand{height:64px;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--line2)}
.brand-mark{
  width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#2f6fed,#6d9bff);
  color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:-.5px;
}
.brand-name{font-size:15px;font-weight:700;letter-spacing:.2px}
.brand-sub{font-size:11px;color:var(--soft);margin-top:-2px}
.nav{padding:14px 12px;flex:1;overflow:auto}
.nav-label{font-size:11px;color:var(--soft);padding:8px 10px 6px;letter-spacing:.6px}
.nav-item{
  display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;margin:2px 0;
  border-radius:9px;color:var(--muted);font-size:13.5px;cursor:pointer;user-select:none;
}
.nav-item:hover{background:#f7f9fc;color:var(--text)}
.nav-item.active{background:var(--primary-weak);color:var(--primary);font-weight:600}
.nav-item.disabled{opacity:.45;cursor:not-allowed}
.nav-dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.65}
.nav-badge{
  margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;
  background:var(--red);color:#fff;font-size:11px;display:grid;place-items:center;font-weight:600;
}
.sidebar-foot{border-top:1px solid var(--line2);padding:14px 18px;font-size:11.5px;color:var(--soft)}
.sidebar-foot b{color:var(--muted);font-weight:600}

.main{margin-left:222px;flex:1;min-width:0;padding:0 28px 64px}
.topbar{
  height:64px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:8;background:rgba(245,247,251,.86);backdrop-filter:blur(8px);
}
.crumb{font-size:12.5px;color:var(--soft)}
.crumb b{color:var(--text);font-weight:600}
.top-actions{display:flex;align-items:center;gap:10px}
.avatar{
  width:32px;height:32px;border-radius:50%;background:#dfe8ff;color:var(--primary);
  display:grid;place-items:center;font-weight:700;font-size:12px;
}

/* ---------- 通用 ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:2px 0 16px}
.page-head h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.2px}
.page-head p{margin:5px 0 0;color:var(--muted);font-size:12.5px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{
  height:34px;padding:0 14px;border:1px solid var(--line);border-radius:8px;
  background:#fff;color:var(--text);font-size:12.5px;display:inline-flex;align-items:center;gap:6px;
  transition:.15s;
}
.btn:hover{border-color:#c9d2e0;background:#fbfcfe}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-dark);border-color:var(--primary-dark)}
.btn.danger{color:var(--red);border-color:#f3c4c0}
.btn.ghost{background:transparent}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--primary);padding:0;font-size:12.5px}
.link.danger{color:var(--red)}
.input,select.input{
  height:34px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 11px;font-size:12.5px;outline:none;
}
.input:focus{border-color:#9db8f5;box-shadow:0 0 0 3px rgba(47,111,237,.10)}
.input.sm{height:28px;font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-head{padding:16px 18px;border-bottom:1px solid var(--line2);display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-head h3{margin:0;font-size:14px;font-weight:700}
.card-head p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:26px;font-weight:750;letter-spacing:-.6px;margin-top:6px}
.stat .s{font-size:11.5px;color:var(--soft);margin-top:4px}
.stat .s b{color:var(--green);font-weight:600}
.stat .s b.warn{color:var(--amber)}
.tabs{display:flex;gap:26px;padding:0 18px;border-bottom:1px solid var(--line2)}
.tab{height:46px;display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.tab .count{font-size:11px;background:#eef1f5;color:var(--muted);border-radius:9px;padding:1px 7px}
.tab.active .count{background:var(--primary-weak);color:var(--primary)}
.filters{display:flex;gap:10px;align-items:center;padding:14px 18px;flex-wrap:wrap;border-bottom:1px solid var(--line2)}
.filters .grow{flex:1}
table{width:100%;border-collapse:collapse}
th{
  text-align:left;font-size:11.5px;color:var(--soft);font-weight:600;letter-spacing:.3px;
  padding:11px 14px;background:#fbfcfe;border-bottom:1px solid var(--line2);white-space:nowrap;
}
td{padding:13px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fafbff}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:-.2px}
.sub{color:var(--muted);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:12px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.gray{background:#f2f4f7;color:#667085}
.pill.blue{background:var(--primary-weak);color:var(--primary)}
.pill.green{background:var(--green-weak);color:var(--green)}
.pill.amber{background:var(--amber-weak);color:var(--amber)}
.pill.red{background:var(--red-weak);color:var(--red)}
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;background:#f2f4f7;color:#475467;font-size:11px}
.tag.lock{background:#fff4e8;color:#b54708}
.qr{display:block;border-radius:6px;background:#fff}
.empty{padding:56px 20px;text-align:center;color:var(--soft)}
.empty b{display:block;color:var(--muted);margin-bottom:4px}

/* ---------- 抽屉 ---------- */
.overlay{position:fixed;inset:0;background:rgba(16,24,40,.34);opacity:0;pointer-events:none;transition:.2s;z-index:40}
.overlay.open{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:860px;max-width:94vw;background:#fff;
  box-shadow:-18px 0 48px rgba(16,24,40,.16);transform:translateX(102%);transition:.24s cubic-bezier(.4,0,.2,1);
  z-index:41;display:flex;flex-direction:column;
}
.drawer.open{transform:translateX(0)}
.drawer-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.drawer-head h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.2px;display:flex;align-items:center;gap:10px}
.drawer-head p{margin:6px 0 0;color:var(--muted);font-size:12.5px}
.icon-btn{width:32px;height:32px;border:1px solid var(--line);border-radius:8px;background:#fff;display:grid;place-items:center;color:var(--muted)}
.drawer-body{flex:1;overflow:auto;padding:20px 24px 110px}
.drawer-foot{
  position:absolute;left:0;right:0;bottom:0;height:76px;background:#fff;border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:14px;
}
.meta-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 18px;background:#fafbfe;border:1px solid var(--line2);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.meta .k{font-size:11.5px;color:var(--soft)}
.meta .v{font-size:13px;font-weight:600;margin-top:3px;word-break:break-all}
.package-card{display:flex;align-items:center;gap:16px;border:1px solid #d9e4ff;background:linear-gradient(135deg,#f5f8ff,#fff);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.package-card .grow{flex:1;min-width:0}
.package-card .k{font-size:11.5px;color:var(--soft)}
.package-card .code{font-size:15px;font-weight:700;letter-spacing:.2px;margin-top:2px}
.package-card .hint{font-size:11.5px;color:var(--muted);margin-top:4px}
.progress{display:flex;align-items:center;gap:12px;margin:2px 0 14px}
.bar{flex:1;height:8px;border-radius:6px;background:#eef1f5;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:6px;background:var(--primary);transition:width .3s}
.progress .txt{font-size:12px;color:var(--muted);white-space:nowrap}
.progress .txt b{color:var(--text);font-weight:700}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px}
.section-title h4{margin:0;font-size:13px;font-weight:700}
.section-title span{font-size:11.5px;color:var(--soft)}
.detail-table th{background:#fff;border-bottom:1px solid var(--line2)}
.detail-table td{padding:11px 10px}
.detail-table .mat b{display:block;font-weight:600}
.detail-table .mat span{display:block;color:var(--soft);font-size:11px;margin-top:1px}
.row-scanned{background:#f7fcf9}
.row-scanned td{border-bottom-color:#e7f3ec}
.check{color:var(--green);font-weight:700}

/* ---------- 弹窗 ---------- */
.modal-wrap{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:24px}
.modal-wrap.open{display:flex}
.modal-mask{position:absolute;inset:0;background:rgba(16,24,40,.42)}
.modal{
  position:relative;width:540px;max-width:100%;max-height:88vh;overflow:auto;background:#fff;border-radius:16px;
  box-shadow:0 24px 64px rgba(16,24,40,.25);padding:22px 24px;
}
.modal.wide{width:760px}
.modal h3{margin:0;font-size:17px;font-weight:700}
.modal .sub{margin:6px 0 0}
.modal-body{margin:16px 0 4px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.form-row{margin-top:14px}
.form-row label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.form-row .input{width:100%}
.summary{background:#fafbfe;border:1px solid var(--line2);border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--muted)}
.summary b{color:var(--text)}
.sign-box{display:flex;align-items:center;gap:12px;border:1px dashed #cdd8ee;border-radius:10px;padding:12px 14px;background:#fbfcff}
.sign-box .who{font-weight:700;font-size:13px}
.sign-box .when{font-size:11.5px;color:var(--soft);margin-top:2px}
.sign-box .ok{margin-left:auto;color:var(--green);font-weight:700;font-size:12px}
.sig-pad{height:96px;border:1px dashed #cdd8ee;border-radius:10px;background:repeating-linear-gradient(0deg,#fff,#fff 23px,#f2f5fa 24px);display:grid;place-items:center;color:var(--soft);font-size:12px}

/* ---------- 标签 ---------- */
.label-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.label-card{border:1px solid #cfd6e3;border-radius:10px;padding:12px 14px;background:#fff}
.label-card .lh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;border-bottom:1px solid #eef1f5;padding-bottom:7px}
.label-card .lh b{font-size:13px}
.label-card .lh span{font-size:11px;color:var(--muted)}
.label-card .lg{display:grid;grid-template-columns:1fr 110px;gap:10px;margin-top:8px}
.label-card .fields{font-size:11.5px;color:#475467;line-height:1.7}
.label-card .fields b{color:#182230;font-weight:600}
.label-card .note{margin-top:7px;font-size:10.5px;color:var(--soft);border-top:1px dashed #e4e7ec;padding-top:6px}
.label-preview{background:#f3f5f9;border-radius:12px;padding:16px}

/* ---------- 原型说明 ---------- */
.notes{
  position:fixed;top:0;right:0;bottom:0;width:380px;background:#fff;border-left:1px solid var(--line);
  box-shadow:-16px 0 40px rgba(16,24,40,.12);transform:translateX(102%);transition:.24s;z-index:55;
  display:flex;flex-direction:column;
}
.notes.open{transform:translateX(0)}
.notes-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.notes-body{padding:18px 20px;overflow:auto;font-size:12.5px;color:var(--muted);line-height:1.7}
.notes-body h4{color:var(--text);font-size:13px;margin:18px 0 6px}
.notes-body h4:first-child{margin-top:0}
.notes-body ol{padding-left:18px;margin:6px 0}
.notes-body li{margin:4px 0}
.notes-body code{background:#f2f4f7;border-radius:4px;padding:1px 5px;font-size:11px;color:#344054}
.notes-body .callout{background:#f5f8ff;border:1px solid #dbe6ff;border-radius:10px;padding:10px 12px;margin:10px 0;color:#344054}

/* ---------- Toast ---------- */
.toast-root{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{
  background:#182230;color:#fff;border-radius:10px;padding:10px 16px;font-size:12.5px;
  box-shadow:0 12px 32px rgba(16,24,40,.25);opacity:0;transform:translateY(8px);transition:.2s;
}
.toast.show{opacity:1;transform:translateY(0)}
.toast.ok{background:#065f46}
.toast.warn{background:#92400e}
.toast.err{background:#991b1b}

@media (max-width:1180px){
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .meta-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

</div>

function qrSvg(seed, size=90){
  // 真实二维码：优先用本地 qrcode-generator 生成，失败时才退回装饰码
  try {
    const qr = qrcode(0, 'M');
    qr.addData(seed);
    qr.make();
    const count = qr.getModuleCount();
    const margin = 4;
    const total = count + margin * 2;
    const cell = size / total;
    let rects = '';
    for (let r=0;r<count;r++) for (let c=0;c<count;c++){
      if (qr.isDark(r,c)) {
        rects += `<rect x="${((c+margin)*cell).toFixed(2)}" y="${((r+margin)*cell).toFixed(2)}" width="${cell.toFixed(2)}" height="${cell.toFixed(2)}"/>`;
      }
    }
    return `<svg class="qr" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" fill="#000"><rect width="${size}" height="${size}" fill="#fff"/>${rects}</svg>`;
  } catch (e) {
    return fakeQrSvg(seed, size);
  }
}
function fakeQrSvg(seed, size=90){
  let h = 2166136261;
  for (let i=0;i<seed.length;i++){ h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619); }
  const rand = () => { h ^= h<<13; h ^= h>>>17; h ^= h<<5; return ((h>>>0)/4294967296); };
  const n = 25, c = size/n;
  let cells = '';
  for (let y=0;y<n;y++) for (let x=0;x<n;x++){
    if ((x<8&&y<8)||(x>=n-8&&y<8)||(x<8&&y>=n-8)) continue;
    if (rand() > 0.52) cells += `<rect x="${(x*c).toFixed(2)}" y="${(y*c).toFixed(2)}" width="${c.toFixed(2)}" height="${c.toFixed(2)}"/>`;
  }
  const finder = (fx,fy) => `<rect x="${fx*c}" y="${fy*c}" width="${7*c}" height="${7*c}" fill="#fff"/><rect x="${(fx+1)*c}" y="${(fy+1)*c}" width="${5*c}" height="${5*c}"/><rect x="${(fx+2)*c}" y="${(fy+2)*c}" width="${3*c}" height="${3*c}" fill="#fff"/>`;
  return `<svg class="qr" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" fill="#111"><rect width="${size}" height="${size}" fill="#fff"/>${cells}${finder(0,0)}${finder(n-7,0)}${finder(0,n-7)}</svg>`;
}
function crc16(str){
  let crc = 0xFFFF;
  for (let i=0;i<str.length;i++){
    crc ^= str.charCodeAt(i) << 8;
    for (let j=0;j<8;j++){
      crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) : (crc << 1);
      crc &= 0xFFFF;
    }
  }
  return crc.toString(16).toUpperCase().padStart(4, '0');
}
function qrContent(type, code){
  return `ERP1|${type}|${code}|${crc16(code)}`;
}
function toast(msg, type=''){
  const root = document.getElementById('toastRoot');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  root.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(), 220); }, 2400);
}

}

function showDrawer(html){
  document.getElementById('drawer').innerHTML = html;
  document.getElementById('drawer').classList.add('open');
  document.getElementById('overlay').classList.add('open');
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
  state.open = null;
}

/* =========================================================
 * 扫码 / 撤销 / 确认
 * ======================================================= */
function findDoc(kind, id){
  if(kind==='inbound') return inboundDocs.find(d=>d.id===id);
  if(kind==='outbound') return outboundDocs.find(d=>d.id===id);
  return returnDocs.find(d=>d.id===id);
}
function refreshOpen(kind, id){
  if(kind==='inbound') openInbound(id);
  else if(kind==='outbound') openOutbound(id);
  else openReturn(id);
  render();
}
function scanLine(docId, lineId, kind){
  const doc = findDoc(kind, docId);
  if(kind==='inbound' && doc.status!=='待入库'){ toast('请先打印入库码，单据进入待入库后才能扫码','warn'); return; }
  const line = doc.lines.find(l=>l.id===lineId);
  line.scanned = true;
  toast('扫码成功：' + line.name + ' · 批次 ' + line.batch, 'ok');
  refreshOpen(kind, docId);
}
function scanAll(docId, kind){
  const doc = findDoc(kind, docId);
  if(kind==='inbound' && doc.status!=='待入库'){ toast('请先打印入库码，单据进入待入库后才能扫码','warn'); return; }
  doc.lines.forEach(l=>l.scanned = true);
  toast('整包扫码成功，共带出 ' + doc.lines.length + ' 种物料', 'ok');
  refreshOpen(kind, docId);
}
function clearLine(docId, lineId, kind){
  const doc = findDoc(kind, docId);
  doc.lines.find(l=>l.id===lineId).scanned = false;
  toast('已撤销该行扫码');
  refreshOpen(kind, docId);
}

/* =========================================================
 * 签名确认
 * ======================================================= */
function openSign(docId, kind){
  const doc = findDoc(kind, docId);
  if(kind==='inbound' && doc.status!=='待入库'){ toast('请先打印入库码并完成扫码','warn'); return; }
  const all = doc.lines.every(l=>l.scanned);
  if(!all){ toast('还有未扫码的明细行，不能确认', 'warn'); return; }
  state.pendingConfirm = {docId, kind};
  const labels = {inbound:'确认入库', outbound:'确认出库', return:'确认退库'};
  const effects = {
    inbound:'确认后将一次性增加库存，入库码状态变为「在库」。',
    outbound:'确认后将一次性扣减库存，入库码剩余数量同步扣减。',
    return:'确认后将回增库存，入库码剩余数量同步回增。'
  };
  document.getElementById('modal').className = 'modal';
  document.getElementById('modal').innerHTML = `
    <h3>${labels[kind]} · 作业签名</h3>
    <p class="sub">${effects[kind]}</p>
    <div class="modal-body">
      <div class="summary">
        单据：<b>${doc.id}</b><br/>
        品种数：<b>${doc.lines.length}</b> · 总量：<b>${doc.lines.reduce((s,l)=>s+Number(l.qty),0).toFixed(2)}</b><br/>
        扫码：<b>全部 ${doc.lines.length} 行已核对</b>
      </div>
      <div class="form-row">
        <label>操作人</label>
        <div class="sign-box">
          <div class="avatar" style="width:34px;height:34px">陶</div>
          <div><div class="who">陶新文 · 库管</div><div class="when">PDA-A03 · 2026-11-13 11:26</div></div>
          <div class="ok">已登录</div>
        </div>
      </div>
      <div class="form-row">
        <label>签名密码（作业签名，必填）</label>
        <input class="input" id="signPwd" type="password" placeholder="请输入登录密码完成签名" />
      </div>
      <div class="form-row">
        <label>手写签名（可选）</label>
        <div class="sig-pad">在此签名（原型占位）</div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn primary" onclick="doConfirm()">签名并${labels[kind].slice(2)}</button>
    </div>`;
  document.getElementById('modalWrap').classList.add('open');
}

function doConfirm(){
  const pwd = document.getElementById('signPwd');
  if(!pwd || !pwd.value.trim()){
    toast('请输入签名密码', 'warn');
    pwd && pwd.focus();
    return;
  }
  const {docId, kind} = state.pendingConfirm || {};
  const doc = findDoc(kind, docId);
  doc.status = kind==='inbound' ? '已入库' : kind==='outbound' ? '已出库' : '已退库';
  closeModal();
  closeDrawer();
  render();
  toast((kind==='inbound'?'入库':kind==='outbound'?'出库':'退库') + '确认成功，库存已更新', 'ok');
  state.pendingConfirm = null;
}

function closeModal(){
  document.getElementById('modalWrap').classList.remove('open');
}

/* =========================================================
 * 标签打印
 * ======================================================= */
function printDoc(id, kind){
  const doc = findDoc(kind, id);
  const pendingPrint = kind==='inbound' && doc.status==='待打印入库码';
  const packageLabel = (kind==='inbound' && doc.packageCode) ? `
    <div class="label-card">
      <div class="lh"><b>整包标签</b><span class="mono">${doc.packageCode}</span></div>
      <div class="lg">
        <div class="fields">
          用途：<b>${doc.purpose || '—'}</b><br/>
          入库时间：<b>2026-11-13</b><br/>
          品种数量：<b>${doc.lines.length} 种</b><br/>
          来源：<b class="mono">${doc.id}</b>
        </div>
        ${qrSvg(qrContent('PK', doc.packageCode), 110)}
      </div>
      <div class="note">${doc.packageCode} · 整包作业扫此码</div>
    </div>` : '';
  const labels = doc.lines.map(l=>`
    <div class="label-card">
      <div class="lh"><b>${l.name}</b><span class="mono">${l.code}</span></div>
      <div class="lg">
        <div class="fields">
          批号：<b>${l.batch}</b><br/>
          入库日期：<b>2026-11-13</b><br/>
          有效期至：<b>${l.expiry}</b><br/>
          入库数量：<b>${l.qty} ${l.unit}</b><br/>
          用途：<b>${doc.purpose || '—'}</b><br/>
          库位：<b>${l.location || '待录入'}</b>
        </div>
        ${qrSvg(qrContent('IC', l.inCode || l.code), 110)}
      </div>
      <div class="note">${l.inCode || l.code} · 部分领用后以系统实时库存为准</div>
    </div>`).join('');
  const total = doc.lines.length + (packageLabel ? 1 : 0);
  document.getElementById('modal').className = 'modal wide';
  document.getElementById('modal').innerHTML = `
    <h3>${pendingPrint?'打印入库码':'标签打印预览'}</h3>
    <p class="sub">${pendingPrint?'打印包码与入库码后，单据进入「待入库」，才能扫码确认。':'补打复用原码，不生成新编码；补打需填写原因并记录操作人、设备与时间。'}</p>
    <div class="modal-body">
      <div class="label-preview">
        <div class="label-grid">${packageLabel}${labels}</div>
      </div>
      <div class="summary" style="margin-top:14px">${pendingPrint?'验收完成后必须先打印入库码；未打印不能扫码，也不会改变库存。':'补打复用原码，不生成新编码；补打需填写原因并记录操作人、设备与时间。'}</div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">关闭</button>
      ${pendingPrint
        ? `<button class="btn primary" onclick="printPcAndMark('${doc.id}','inbound')">打印并确认（${total} 张）</button>`
        : `<button class="btn primary" onclick="printPcWindow(findDoc('${kind}','${doc.id}'))">打印（${total} 张）</button>`}
    </div>`;
  document.getElementById('modalWrap').classList.add('open');
}
function markPrinted(id, kind){
  const doc = findDoc(kind, id);
  const wasPending = doc.status==='待打印入库码';
  if(wasPending){
    doc.status = '待入库';
    if(state.view==='inbound') state.inboundTab = 'scan';
  }
  closeModal();
  toast(wasPending?'标签已打印，单据进入待入库扫码':'打印任务已发送（原型）','ok');
  render();
  if(state.open && state.open.kind===kind && state.open.id===id) refreshOpen(kind, id);
}

      <div class="note">部分领用后以系统实时库存为准</div>
    </div>
    <div class="qr">${qr}</div>
  </div>`;
}

function printPcWindow(doc){
  if(!doc) return false;
  const w = window.open('', '_blank');
  if(!w){ toast('浏览器阻止了打印窗口，请允许弹窗后重试','err'); return false; }
  w.document.open();
  w.document.write(buildPcPrintHtml(doc));
  w.document.close();
  toast('已打开打印预览，请选择打印机或另存为 PDF','ok');
  setTimeout(()=>{ try { w.focus(); w.print(); } catch(e){} }, 500);
  return true;
}
function printPcAndMark(id, kind){
  const doc = findDoc(kind, id);
  if(!printPcWindow(doc)) return;
  setTimeout(()=>markPrinted(id, kind), 900);
}

/* =========================================================
 * 原型说明
 * ======================================================= */
function notesHtml(){
  return `
  <div class="callout"><b>核心变化</b><br/>现有 PC 端是「保存即入库/出库」。本原型改为：验收完成后先进入 <code>待打印入库码</code>，打印后转为 <code>待入库</code>，扫码扫满并<b>手动确认</b>才改库存。扫码只记录核对，不改数量。</div>
  <h4>PC 端操作路径</h4>
  <ol>
    <li>验收签名：验收人、复核人双签 → 生成入库码与包码，单据进入「待打印入库码」。</li>
    <li>入库管理：待打印入库码 → 打印包码与入库码 → 转为「待入库」→ 整包扫码或逐行扫码 → 录入库位 → 确认入库（作业签名）。</li>
    <li>出库管理：生产领料草稿数量锁定 → 扫码核对 → 确认出库。</li>
    <li>退库管理：选择原出库单 → 录入退库数量 → 扫码 → 确认退库。</li>
    <li>标签打印：入库码/包码预览、打印、补打（留痕）。</li>
  </ol>
  <h4>状态规则</h4>
  <ol>
    <li>验收完成后是「待打印入库码」，未打印不能扫码，库存不变。</li>
    <li>打印完成后转为「待入库」，扫码扫满并手动确认后才变「已入库」。</li>
    <li>未扫满不能确认，库存不变。</li>
    <li>确认后一次性改库存，单据变已入库/已出库/已退库。</li>
    <li>扫码可撤销；撤销以一次扫码动作为单位（整包扫一次撤销整组）。</li>
    <li>重复扫同一码提示已扫，不重复计数。</li>
  </ol>
  <h4>明细行扫码</h4>
  <p>每行右侧「扫码」按钮：扫入库码后回填批次/效期/入库码，行变绿；支持清除后重扫。整包扫码等价于批量行扫码。</p>
  <h4>设计取舍</h4>
  <p>PC 端保留现有列表/详情结构，只增加状态列、扫码按钮与确认按钮；不改变原有录单方式。</p>`;
}
