<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>ERP 移动作业 · PDA 端原型</title>
<style>
:root{
  --primary:#2f6fed; --primary-weak:#eaf1ff; --primary-dark:#1f5bd7;
  --green:#079455; --green-weak:#e7f6ee;
  --amber:#dc6803; --amber-weak:#fef4e6;
  --red:#d92d20; --red-weak:#fdeceb;
  --text:#182230; --muted:#667085; --soft:#98a2b3;
  --line:#e4e7ec; --line2:#eef1f5; --bg:#f5f7fb; --card:#fff;
  --radius:16px; --radius-sm:11px;
  --shadow:0 2px 4px rgba(16,24,40,.04), 0 12px 28px rgba(16,24,40,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:#0d1526;display:flex;align-items:center;justify-content:center;padding:24px;
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;
  color:var(--text);-webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
::-webkit-scrollbar{width:0;height:0}

.phone{
  width:390px;height:844px;background:var(--bg);border-radius:44px;overflow:hidden;position:relative;
  box-shadow:0 0 0 10px #1b2538,0 0 0 12px #2b3850,0 40px 90px rgba(0,0,0,.55);
  display:flex;flex-direction:column;
}
.statusbar{
  height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:0 26px;font-size:12px;font-weight:650;color:#111;background:transparent;z-index:5;
}
.statusbar .right{display:flex;align-items:center;gap:5px}
.signal{display:flex;align-items:flex-end;gap:1.5px;height:10px}
.signal i{width:2.5px;background:#111;border-radius:1px}
.signal i:nth-child(1){height:4px}.signal i:nth-child(2){height:6px}.signal i:nth-child(3){height:8px}.signal i:nth-child(4){height:10px}
.battery{width:20px;height:10px;border:1.4px solid #111;border-radius:3px;position:relative}
.battery::after{content:"";position:absolute;right:-3px;top:2.6px;width:2px;height:4px;background:#111;border-radius:1px}
.battery i{display:block;height:100%;width:72%;background:#111;border-radius:1.5px}

.app{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}
.appbar{
  height:54px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--bg);
  position:relative;z-index:4;
}
.appbar .back{width:36px;height:36px;border:0;background:#fff;border-radius:11px;display:grid;place-items:center;box-shadow:var(--shadow)}
.appbar .title{font-size:17px;font-weight:750;letter-spacing:-.2px}
.appbar .sub{font-size:11px;color:var(--soft);margin-top:1px}
.appbar .right{margin-left:auto;display:flex;gap:8px}
.content{flex:1;min-height:0;overflow:auto;padding:4px 16px 20px}
.bottom-bar{
  flex:none;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:#fff;
  border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;
}
.btn{
  height:48px;padding:0 18px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--text);
  font-size:15px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:7px;
}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 8px 18px rgba(47,111,237,.25)}
.btn.primary:disabled{background:#c7d4ee;border-color:#c7d4ee;box-shadow:none;color:#fff}
.btn.block{width:100%}
.btn.ghost{background:transparent}
.btn.sm{height:34px;padding:0 12px;font-size:12.5px;border-radius:9px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:16px}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:11px;font-size:11px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.pill.amber{background:var(--amber-weak);color:var(--amber)}
.pill.green{background:var(--green-weak);color:var(--green)}
.pill.gray{background:#f2f4f7;color:#667085}
.pill.blue{background:var(--primary-weak);color:var(--primary)}
.pill.red{background:var(--red-weak);color:var(--red)}
.sub{color:var(--muted);font-size:12px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:-.2px}

/* ---------- 登录 ---------- */
.login{padding:26px 22px;display:flex;flex-direction:column;height:100%}
.login-brand{display:flex;align-items:center;gap:12px;margin-top:16px}
.login-mark{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#2f6fed,#6d9bff);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px}
.login h1{margin:0;font-size:22px;letter-spacing:-.4px}
.login .sub{margin-top:4px}
.device-card{margin-top:26px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.device-icon{width:42px;height:42px;border-radius:12px;background:var(--primary-weak);color:var(--primary);display:grid;place-items:center}
.device-card b{display:block;font-size:14px}
.device-card .sub{font-size:11.5px;margin-top:2px}
.device-card .ok{margin-left:auto;color:var(--green);font-size:11.5px;font-weight:700}
.login-form{margin-top:22px;display:flex;flex-direction:column;gap:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.field input{width:100%;height:50px;border:1px solid var(--line);border-radius:13px;background:#fff;padding:0 14px;font-size:15px;outline:none}
.field input:focus{border-color:#9db8f5;box-shadow:0 0 0 4px rgba(47,111,237,.10)}
.login-note{margin-top:auto;font-size:11.5px;color:var(--soft);line-height:1.7;padding-bottom:8px}
.login-note b{color:var(--muted)}

/* ---------- 首页 ---------- */
.home-head{display:flex;align-items:center;gap:12px;padding:8px 2px 16px}
.home-head .avatar{width:44px;height:44px;border-radius:50%;background:#dfe8ff;color:var(--primary);display:grid;place-items:center;font-weight:800;font-size:15px}
.home-head b{display:block;font-size:16px}
.home-head .sub{font-size:11.5px;margin-top:1px}
.home-head .bell{margin-left:auto;width:38px;height:38px;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;position:relative}
.home-head .bell::after{content:"";position:absolute;top:9px;right:9px;width:6px;height:6px;border-radius:50%;background:var(--red)}
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.action{
  border-radius:16px;padding:16px;color:#fff;position:relative;overflow:hidden;border:0;text-align:left;
  min-height:104px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow);
}
.action.blue{background:linear-gradient(135deg,#2f6fed,#5b8cf7)}
.action.green{background:linear-gradient(135deg,#07865a,#20a97a)}
.action.amber{background:linear-gradient(135deg,#c96a05,#e7912f)}
.action.slate{background:linear-gradient(135deg,#475467,#667085)}
.action .ico{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.2);display:grid;place-items:center}
.action b{font-size:15px;display:block;margin-top:8px}
.action span{font-size:11px;opacity:.82;display:block;margin-top:2px}
.action .arrow{position:absolute;right:12px;bottom:12px;opacity:.5}
.section{margin-top:20px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.section-head b{font-size:14px}
.section-head a{font-size:12px;color:var(--primary);text-decoration:none}
.mini-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;box-shadow:var(--shadow)}
.mini .v{font-size:21px;font-weight:800;letter-spacing:-.5px}
.mini .k{font-size:10.5px;color:var(--soft);margin-top:2px}
.task-card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;box-shadow:var(--shadow);margin-bottom:10px}
.task-card .top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.task-card .no{font-size:13.5px;font-weight:750}
.task-card .meta{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.6}
.task-card .foot{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line2)}
.task-card .foot .sub{font-size:11px}
.task-card .foot .btn{margin-left:auto}

/* ---------- 任务列表 ---------- */
.seg{display:flex;background:#e9edf4;border-radius:12px;padding:4px;margin:6px 0 14px}
.seg button{flex:1;height:38px;border:0;background:transparent;border-radius:9px;font-size:13px;font-weight:650;color:var(--muted)}
.seg button.active{background:#fff;color:var(--text);box-shadow:0 1px 4px rgba(16,24,40,.12)}

/* ---------- 作业页 ---------- */
.doc-summary{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px 15px;box-shadow:var(--shadow);margin-bottom:12px}
.doc-summary .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.doc-summary .no{font-size:14px;font-weight:750}
.doc-summary .meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:10px;font-size:11.5px;color:var(--muted)}
.doc-summary .meta b{color:var(--text);font-weight:600}
.scan-panel{
  border:1.5px dashed #b9cdf5;background:linear-gradient(180deg,#f7faff,#fff);border-radius:16px;
  padding:18px 16px;text-align:center;margin-bottom:12px;
}
.scan-ico{width:54px;height:54px;border-radius:16px;background:var(--primary-weak);color:var(--primary);display:grid;place-items:center;margin:0 auto 10px}
.scan-panel b{display:block;font-size:15px}
.scan-panel .sub{font-size:11.5px;margin-top:3px}
.scan-input-row{display:flex;gap:8px;margin-top:14px}
.scan-input{
  flex:1;min-width:0;height:52px;border:2px solid var(--primary);border-radius:13px;background:#fff;
  padding:0 14px;font-size:16px;font-weight:700;outline:none;letter-spacing:.4px;
  transition:box-shadow .15s,border-color .15s;
}
.scan-input::placeholder{color:#9aa7bd;font-weight:500;letter-spacing:0}
.scan-input:focus{box-shadow:0 0 0 4px rgba(47,111,237,.14)}
.scan-input-row .btn{height:52px;min-width:74px;padding:0 14px;font-size:15px;border-radius:13px}
.scan-status{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;color:var(--green);margin-top:9px}
.scan-status i{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(7,148,85,.12)}
.scan-tip{font-size:10.5px;color:var(--soft);margin-top:6px;line-height:1.5}
.scan-links{display:flex;justify-content:center;gap:18px;margin-top:10px}
.scan-links .link{background:none;border:0;color:var(--primary);font-size:11.5px;padding:0}
.last-scan{margin-top:9px;font-size:11px;color:var(--soft);min-height:16px;word-break:break-all}
.last-scan b{color:var(--muted)}
.scan-panel .manual{display:inline-block;margin-top:10px;font-size:11.5px;color:var(--primary)}
.progress-card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px 15px;box-shadow:var(--shadow);margin-bottom:12px}
.progress-card .row{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}
.progress-card .row b{color:var(--text);font-size:13px}
.bar{height:8px;border-radius:5px;background:#eef1f5;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;background:var(--primary);border-radius:5px;transition:width .3s}
.line-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:9px;display:flex;gap:11px;align-items:flex-start}
.line-card.scanned{border-color:#bfe3cd;background:#f7fcf9}
.line-num{width:26px;height:26px;border-radius:8px;background:#f2f4f7;color:var(--muted);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.line-card.scanned .line-num{background:var(--green-weak);color:var(--green)}
.line-main{flex:1;min-width:0}
.line-main b{display:block;font-size:13.5px}
.line-main .sub{font-size:11px;margin-top:2px}
.line-main .qty{font-size:12px;margin-top:5px;color:var(--muted)}
.line-main .qty b{display:inline;color:var(--text);font-size:12.5px}
.line-status{flex:none;align-self:center}
.check-ico{width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800}
.loc-row{display:flex;align-items:center;gap:10px;margin:14px 0 4px}
.loc-row label{font-size:12px;color:var(--muted);white-space:nowrap}
.loc-row input{flex:1;height:42px;border:1px solid var(--line);border-radius:11px;padding:0 12px;background:#fff;outline:none}
.hint{font-size:11px;color:var(--soft);line-height:1.6;margin-top:8px}
.bottom-bar .progress-txt{font-size:11.5px;color:var(--muted);line-height:1.4}
.bottom-bar .progress-txt b{display:block;color:var(--text);font-size:14px}
.bottom-bar .btn{flex:1}

/* ---------- 底部导航 ---------- */
.tabbar{
  flex:none;height:62px;background:#fff;border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--soft);font-size:10px}
.tabbar button.active{color:var(--primary)}
.tabbar svg{width:21px;height:21px}

/* ---------- 底部弹层 ---------- */
.sheet-wrap{position:absolute;inset:0;z-index:30;display:none}
.sheet-wrap.open{display:block}
.sheet-mask{position:absolute;inset:0;background:rgba(16,24,40,.42)}
.sheet{
  position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));
  box-shadow:0 -18px 50px rgba(16,24,40,.25);animation:up .22s ease-out;
}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet .handle{width:38px;height:4px;border-radius:3px;background:#d6dce6;margin:0 auto 14px}
.sheet h3{margin:0;font-size:17px}
.sheet .sub{margin-top:4px}
.sheet .summary{background:#fafbfe;border:1px solid var(--line2);border-radius:12px;padding:12px 14px;font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.8}
.sheet .summary b{color:var(--text)}
.sheet .field{margin-top:14px}
.sheet .field input{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;padding:0 13px;outline:none;font-size:15px}
.sheet .actions{display:flex;gap:10px;margin-top:16px}
.sheet .actions .btn{flex:1}

/* ---------- 成功 ---------- */
.success{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.success .ico{width:82px;height:82px;border-radius:50%;background:var(--green-weak);color:var(--green);display:grid;place-items:center;font-size:38px;font-weight:800;margin-bottom:18px}
.success h2{margin:0;font-size:21px;letter-spacing:-.3px}
.success .sub{margin-top:6px;line-height:1.7}
.success .summary{width:100%;background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px 16px;margin-top:22px;text-align:left;box-shadow:var(--shadow)}
.success .summary .row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:5px 0}
.success .summary .row b{color:var(--text)}
.success .actions{width:100%;display:flex;gap:10px;margin-top:20px}

/* ---------- 补打/记录 ---------- */
.code-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;box-shadow:var(--shadow);margin-bottom:9px;display:flex;align-items:center;gap:12px}
.code-card .qrbox{width:56px;height:56px;border-radius:9px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;flex:none}
.code-card b{display:block;font-size:13px}
.code-card .sub{font-size:11px;margin-top:2px}
.code-card .btn{margin-left:auto}
.reprint-main{flex:1;min-width:0}
.reprint-filters{display:flex;gap:8px;margin-bottom:12px}
.reprint-filters select{flex:1;min-width:0;height:40px;border:1px solid var(--line);border-radius:11px;background:#fff;padding:0 10px;font-size:12.5px;outline:none}
.reprint-filters select:focus{border-color:#9db8f5;box-shadow:0 0 0 4px rgba(47,111,237,.10)}
.code-card .btn:disabled{opacity:.55}
.record{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;box-shadow:var(--shadow);margin-bottom:9px}
.record .top{display:flex;justify-content:space-between;align-items:center}
.record b{font-size:13px}
.record .sub{font-size:11px;margin-top:3px}
.record .lines{font-size:11.5px;color:var(--muted);margin-top:7px;line-height:1.7}
.profile-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px}
.profile-card .avatar{width:54px;height:54px;border-radius:50%;background:#dfe8ff;color:var(--primary);display:grid;place-items:center;font-size:18px;font-weight:800}
.profile-card b{font-size:16px}
.profile-card .sub{font-size:11.5px;margin-top:2px}
.list-card{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);margin-top:14px;overflow:hidden}
.list-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line2);font-size:13.5px}
.list-row:last-child{border-bottom:0}
.list-row .ico{width:32px;height:32px;border-radius:9px;background:#f2f4f7;display:grid;place-items:center;color:var(--muted)}
.list-row .arrow{margin-left:auto;color:var(--soft)}

/* ---------- 生产工序执行 ---------- */
.exec-hero{
  background:linear-gradient(135deg,#1f4fbf,#2f6fed 55%,#5b8cf7);border-radius:18px;padding:17px 18px;
  color:#fff;box-shadow:0 12px 26px rgba(31,79,191,.28);margin-bottom:14px;position:relative;overflow:hidden;
}
.exec-hero::after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.10);right:-50px;top:-60px}
.exec-hero .k{font-size:11px;opacity:.82}
.exec-hero .v{font-size:21px;font-weight:800;letter-spacing:-.4px;margin-top:3px}
.exec-hero .row{display:flex;gap:22px;margin-top:13px;font-size:11px;opacity:.9}
.exec-hero .row b{display:block;font-size:17px;opacity:1;font-weight:750;margin-bottom:1px}
.search-row{display:flex;gap:8px;margin:6px 0 12px}
.search-row input{flex:1;min-width:0;height:40px;border:1px solid var(--line);border-radius:11px;padding:0 12px;background:#fff;font-size:13px;outline:none}
.search-row input:focus{border-color:#9db8f5;box-shadow:0 0 0 4px rgba(47,111,237,.10)}
.search-row .btn{height:40px;flex:none;border-radius:11px}
.exec-task{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.exec-task-head{display:flex;gap:10px;justify-content:space-between;padding:13px 14px;background:#fbfcfe;border-bottom:1px solid var(--line2)}
.exec-task-name{font-size:15px;font-weight:750}
.exec-task-head .sub{font-size:11px;margin-top:3px;line-height:1.55}
.exec-task-right{text-align:right;flex:none}
.exec-task-right .sub{margin-top:6px;font-size:10.5px}
.exec-proc-row{display:flex;gap:9px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line2);cursor:pointer}
.exec-proc-row:last-child{border-bottom:0}
.exec-proc-row:active{background:#f7faff}
.exec-seq{width:24px;height:24px;border-radius:7px;background:#f2f4f7;color:var(--muted);font-size:11px;font-weight:700;display:grid;place-items:center;flex:none}
.exec-proc-main{flex:1;min-width:0}
.exec-proc-title{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.exec-proc-title b{font-size:13px}
.exec-proc-main .sub{font-size:10.5px;margin-top:2px;line-height:1.5}
.exec-proc-main .sub b{color:var(--text);font-weight:600}
.exec-arrow{color:var(--soft);font-size:18px;flex:none}
.exec-empty{padding:34px 14px;text-align:center;color:var(--soft);font-size:12px}
.punch-card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.punch-row{display:flex;gap:10px}

.punch-now{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--soft);margin-top:10px}
.punch-now b{color:var(--text)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;height:23px;padding:0 8px;border-radius:7px;background:#f2f4f7;color:#475467;font-size:11px;margin:2px 4px 2px 0;cursor:pointer;user-select:none}
.chip.sel{background:var(--primary-weak);color:var(--primary);font-weight:600}
.form-card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;box-shadow:var(--shadow);margin-bottom:12px}

.form-row{margin-bottom:12px}
.form-row:last-child{margin-bottom:0}
.form-row label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px}
.form-row .hint{font-size:10.5px;color:var(--soft);margin-top:5px;line-height:1.5}

.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:#9db8f5;box-shadow:0 0 0 4px rgba(47,111,237,.10)}
.form-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

function qrSvg(seed, size=40){
  // 真实二维码：优先用本地 qrcode-generator 生成，失败时才退回装饰码
  try {
    const qr = qrcode(0, 'M');
    qr.addData(seed);
    qr.make();
    const count = qr.getModuleCount();
    const margin = 4;
    const total = count + margin * 2;
    const cell = size / total;
    let rects = '';
    for (let r=0;r<count;r++) for (let c=0;c<count;c++){
      if (qr.isDark(r,c)) {
        rects += `<rect x="${((c+margin)*cell).toFixed(2)}" y="${((r+margin)*cell).toFixed(2)}" width="${cell.toFixed(2)}" height="${cell.toFixed(2)}"/>`;
      }
    }
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" fill="#000"><rect width="${size}" height="${size}" fill="#fff"/>${rects}</svg>`;
  } catch (e) {
    return fakeQrSvg(seed, size);
  }
}
function fakeQrSvg(seed, size=40){
  let h = 2166136261;
  for (let i=0;i<seed.length;i++){ h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619); }
  const rand = () => { h ^= h<<13; h ^= h>>>17; h ^= h<<5; return ((h>>>0)/4294967296); };
  const n = 21, c = size/n;
  let cells = '';
  for (let y=0;y<n;y++) for (let x=0;x<n;x++){
    if ((x<7&&y<7)||(x>=n-7&&y<7)||(x<7&&y>=n-7)) continue;
    if (rand() > 0.5) cells += `<rect x="${x*c}" y="${y*c}" width="${c}" height="${c}"/>`;
  }
  const f = (fx,fy)=>`<rect x="${fx*c}" y="${fy*c}" width="${7*c}" height="${7*c}" fill="#fff"/><rect x="${(fx+1)*c}" y="${(fy+1)*c}" width="${5*c}" height="${5*c}"/><rect x="${(fx+2)*c}" y="${(fy+2)*c}" width="${3*c}" height="${3*c}" fill="#fff"/>`;
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" fill="#111"><rect width="${size}" height="${size}" fill="#fff"/>${cells}${f(0,0)}${f(n-7,0)}${f(0,n-7)}</svg>`;
}
function crc16(str){
  let crc = 0xFFFF;
  for (let i=0;i<str.length;i++){
    crc ^= str.charCodeAt(i) << 8;
    for (let j=0;j<8;j++){
      crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) : (crc << 1);
      crc &= 0xFFFF;
    }
  }
  return crc.toString(16).toUpperCase().padStart(4, '0');
}
function qrContent(type, code){
  return `ERP1|${type}|${code}|${crc16(code)}`;
}
function toast(msg, type=''){
  const root = document.getElementById('toastRoot');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  root.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(), 220); }, 2200);
}

function taskCard(d, kind){
  const total = d.lines.length;
  const done = d.lines.filter(l=>l.scanned).length;
  const status = d.status || (kind==='inbound'?'待入库':kind==='outbound'?'草稿':'草稿');
  const pendingPrint = kind==='inbound' && status==='待打印入库码';
  const finished = ['已入库','已出库','已退库'].includes(status);
  const pillClass = pendingPrint ? 'amber' : finished ? 'green' : (status==='待入库' || kind==='outbound' || kind==='blocked') ? 'blue' : 'gray';
  const progress = pendingPrint
    ? `待打印 ${total} 张标签`
    : `${total} 种物料 · 已扫 ${done}/${total}`;
  const action = pendingPrint
    ? `<button class="btn sm primary" onclick="openPrint('${kind}')">打印入库码</button>`
    : finished
      ? `<button class="btn sm" onclick="toast('该单已完成','warn')">查看</button>`
      : `<button class="btn sm primary" onclick="openWork('${kind}')">${done ? '继续扫码' : '开始扫码'}</button>`;
  return `
  <div class="task-card">
    <div class="top">
      <div><div class="no mono">${d.id}</div><div class="meta">${d.type} · ${d.warehouse}<br/>来源 ${d.source}</div></div>
      <span class="pill ${pillClass}">${status}</span>
    </div>
    <div class="foot">
      <span class="sub">${progress}</span>
      ${action}
    </div>
  </div>`;
}

/* ---------- 真实扫码（扫描头键盘模拟） ---------- */
function parseScan(raw){
  const s = String(raw || '').trim();
  if (!s) return { type:'unknown', code:'' };
  // 二维码内容：ERP1|IC|in...|CRC / ERP1|PK|pk...|CRC
  if (/^ERP1\|/i.test(s)) {
    const parts = s.split('|');
    const type = (parts[1] || '').toUpperCase();
    const code = (parts[2] || '').trim();
    if (type === 'PK') return { type:'package', code };
    if (type === 'IC') return { type:'inbound', code };
    return { type:'unknown', code };
  }
  if (/^pk/i.test(s)) return { type:'package', code:s };
  if (/^in/i.test(s)) return { type:'inbound', code:s };
  return { type:'unknown', code:s };
}

function lineIssue(line, kind){
  const today = '2026-11-13';
  if(!line) return '';
  if(kind==='inbound'){
    if(line.expiry && line.expiry < today) return 'warn:批次已过期，请复核后入库';
    return '';
  }
  if(line.expiry && line.expiry < today) return 'err:批次已过期，不能出库';
  if(line.available!=null && Number(line.qty) > Number(line.available)) return 'err:可用数量不足（可用 '+line.available+'）';
  return '';
}
function handleScan(raw){
  const d = doc();
  const text = String(raw || '').trim();
  if (!text) return;
  clearTimeout(state.scanTimer);
  const parsed = parseScan(text);
  const kind = state.current;
  const isOut = kind==='outbound' || kind==='blocked';
  let ok = false, msg = '';

  if (parsed.type === 'package') {
    // 已停用整包扫码：包码不再作为作业码，避免一次带出多行
    msg = '已停用整包扫码，请逐条扫描入库码';
  } else if (parsed.type === 'inbound') {
    const line = d.lines.find(l => l.inCode && l.inCode.toLowerCase() === parsed.code.toLowerCase());
    if (!line) msg = '入库码不属于当前单据';
    else if (line.scanned) msg = '该码已扫描，不重复计数';
    else {
      const issue = lineIssue(line, kind);
      if(issue.startsWith('err')){
        msg = issue.slice(4)+'：'+line.name;
      }else{
        line.scanned = true;
        ok = true;
        msg = '扫码成功：' + line.name + ' · 批次 ' + line.batch;
        if(issue.startsWith('warn')) msg += '（'+issue.slice(5)+'）';
      }
    }
  } else {
    // 物料码仅作物料档案标识，不参与扫码
    if(d.lines.some(l=>l.code && l.code.toLowerCase()===parsed.code.toLowerCase())){
      msg = '物料码仅作物料档案标识，请扫描入库码';
    }else{
      msg = '无法识别的条码';
    }
  }

  if(ok && !state.online){
    state.scanQueue.push({code:text, time:new Date().toLocaleTimeString('zh-CN',{hour12:false})});
    msg += '（离线暂存，恢复网络后提交）';
  }
  state.lastScan = { code:text, ok, msg, time:new Date().toLocaleTimeString('zh-CN', { hour12:false }) };
  toast(msg, ok ? (state.online ? 'ok' : 'warn') : 'err');
  beep(ok);
  updateWorkUI();
}

function updateWorkUI(){
  const d = doc();
  const total = d.lines.length;
  const done = scannedCount();
  const pct = total ? Math.round(done / total * 100) : 0;
  const lines = document.getElementById('linesWrap');
  if (lines) lines.innerHTML = d.lines.map((l,i) => lineCard(l,i)).join('');
  const bar = document.getElementById('progressBar');
  if (bar) bar.style.width = pct + '%';
  const count = document.getElementById('progressCount');
  if (count) count.textContent = done + '/' + total;
  const bottom = document.getElementById('bottomProgress');
  if (bottom) bottom.innerHTML = `<b>${done}/${total}</b>${allScanned() ? '已扫满，可确认' : '还差 ' + (total - done) + ' 行'}`;
  const btn = document.getElementById('confirmBtn');
  if (btn) btn.disabled = !allScanned();
  const last = document.getElementById('lastScan');
  if (last) last.innerHTML = state.lastScan
    ? `最近扫码：<b>${esc(state.lastScan.code)}</b> · ${esc(state.lastScan.msg)}`

  focusScanInput();
}

let audioCtx = null;
let pointerGesture = false;
document.addEventListener('pointerdown', () => { pointerGesture = true; }, { once:true, capture:true });
document.addEventListener('touchstart', () => { pointerGesture = true; }, { once:true, capture:true });

function beep(ok){
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = ok ? 980 : 220;
    gain.gain.value = 0.07;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + (ok ? 0.09 : 0.22));
  } catch (e) {}
  if (pointerGesture && navigator.vibrate) {
    try { navigator.vibrate(ok ? 50 : [80, 60, 80]); } catch (e) {}
  }
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function filteredReprintLabels(){
  const f = state.reprintFilter;
  return reprintLabels.filter(l=>{
    if(f.warehouse!=='全部' && l.warehouse!==f.warehouse) return false;
    if(f.status!=='全部' && l.status!==f.status) return false;
    if(f.keyword){
      const k = f.keyword.toLowerCase();
      const hit = l.name.toLowerCase().includes(k)
        || l.materialCode.toLowerCase().includes(k)
        || l.batch.toLowerCase().includes(k)
        || l.code.toLowerCase().includes(k)

    }
    return true;
  });

function doManualEntry(){

  if(!code){ toast('请输入入库码或物料编码','warn'); return; }

}

/* =========================================================
 * 生产工序执行 · 状态与工具
 * ======================================================= */
/** 数字格式化：最多两位小数 */
function execNum(n){
  if(n==null || isNaN(Number(n))) return '—';
  return Number(n).toLocaleString('zh-CN',{maximumFractionDigits:2});
}
/** HH:mm 转分钟，非法返回 null */
function execParseTime(v){
  const m = String(v==null?'':v).trim().match(/^(\d{1,2}):(\d{2})$/);
  if(!m) return null;
  const h = Number(m[1]), mm = Number(m[2]);
  if(h>23 || mm>59) return null;
  return h*60+mm;
}
/** 分钟转 HH:mm */
function execFmt(min){
  return String(Math.floor(min/60)).padStart(2,'0')+':'+String(min%60).padStart(2,'0');
}
/** 当前时间（分钟） */
function execNow(){
  const d = new Date();
  return d.getHours()*60 + d.getMinutes();
}
function execNowText(){ return execFmt(execNow()); }
/** 任务状态：未开始 / 进行中 / 已完成 */
function execTaskStatus(t){
  if(t.procs.every(p=>p.submitted)) return '已完成';
  if(t.procs.every(p=>!p.actualPs && !p.submitted)) return '未开始';
  return '进行中';
}
/** 工序状态：未开始 / 进行中 / 已提交 */
function execProcStatus(p){
  if(p.submitted) return '已提交';
  if(p.actualPs) return '进行中';
  return '未开始';
}
function execStatusCls(s){
  return s==='已提交' || s==='已完成' ? 'green' : s==='进行中' ? 'blue' : 'gray';
}
/** 计划开始时间升序；未排期排最后，按创建时间升序 */
function execSortedTasks(){
  return execTasks.slice().sort((a,b)=>{
    if(a.planStart && b.planStart) return a.planStart.localeCompare(b.planStart);
    if(a.planStart) return -1;
    if(b.planStart) return 1;
    return String(a.createdAt||'').localeCompare(String(b.createdAt||''));
  });
}
function execFilteredTasks(){
  const f = state.execFilter;
  return execSortedTasks().filter(t=>{
    if(f.status!=='全部' && execTaskStatus(t)!==f.status) return false;
    if(f.ws!=='全部' && t.ws!==f.ws) return false;
    if(f.proc!=='全部' && !t.procs.some(p=>p.name===f.proc)) return false;
    if(f.person!=='全部' && !t.procs.some(p=>(p.people||[]).includes(f.person))) return false;
    if(f.keyword){
      const k = f.keyword.toLowerCase();
      if(!(t.name.toLowerCase().includes(k) || t.batch.toLowerCase().includes(k))) return false;
    }
    return true;
  });
}
function execFilterActiveCount(){
  const f = state.execFilter;
  return ['status','person','proc','ws'].filter(k=>f[k]!=='全部').length + (f.keyword?1:0);
}
function execGlobalStats(){
  const procs = [];
  execTasks.forEach(t=>t.procs.forEach(p=>procs.push(p)));
  return {
    tasks: execTasks.length,
    procs: procs.length,
    submitted: procs.filter(p=>p.submitted).length,
    doing: procs.filter(p=>p.actualPs && !p.submitted).length,
    todo: procs.filter(p=>!p.actualPs && !p.submitted).length
  };
}
function execCurrent(){
  const t = execTasks.find(x=>x.code===state.exec.taskCode) || execTasks[0];
  const p = t.procs.find(x=>x.id===state.exec.procId) || t.procs[0];
  return {t,p};
}

function execTogglePerson(el){
  const name = el.dataset.name;
  el.classList.toggle('sel');
  const row = document.querySelector('#execPersonQty .person-qty-row[data-name="'+name+'"]');
  if(row) row.style.display = el.classList.contains('sel') ? 'flex' : 'none';
  execSyncQtyTotal();
}
function execMarkManual(){
  const {p} = execCurrent();
  p.manual = true;
}
function execSyncQtyTotal(){
  const box = document.getElementById('execQtySum');
  if(!box) return;
  const people = execSelectedPeople();
  const qtyEl = document.getElementById('execQty');
  const qty = qtyEl && qtyEl.value!=='' ? Number(qtyEl.value) : null;
  let sum = 0;
  people.forEach(n=>{
    const el = document.querySelector('#execPersonQty .person-qty-row[data-name="'+n+'"] input');
    if(el && el.value!=='') sum += Number(el.value)||0;
  });
  const ok = qty!=null && qty>0 && Math.abs(sum-qty)<0.005;
  box.innerHTML = `逐人合计 <b class="${ok?'ok':'bad'}">${execNum(sum)}</b> / 加工数量 ${qty!=null?execNum(qty):'—'}`;
}
function execAverageQty(){
  const people = execSelectedPeople();
  const qtyEl = document.getElementById('execQty');
  const qty = qtyEl ? Number(qtyEl.value) : NaN;
  if(!qty || qty<=0){ toast('请先填写加工数量','warn'); return; }
  if(!people.length){ toast('请先选择操作人','warn'); return; }
  const cents = Math.round(qty*100);
  const base = Math.floor(cents/people.length);
  let assigned = 0;
  people.forEach((n,i)=>{
    const c = i===people.length-1 ? cents-assigned : base;
    assigned += c;
    const input = document.querySelector('#execPersonQty .person-qty-row[data-name="'+n+'"] input');
    if(input) input.value = (c/100).toFixed(2);
  });
  execSyncQtyTotal();
  toast('已平均分配，尾差计入最后一人','ok');
}
function execAddPhotos(e){
  const {p} = execCurrent();
  const files = Array.from(e.target.files||[]);
  let added = 0;
  for(const f of files){
    if(p.photos.length>=9){ toast('每道工序最多 9 张照片','warn'); break; }
    if(!/^image\/(jpeg|jpg|png)$/i.test(f.type)){ toast(f.name+' 仅支持 JPG / PNG','err'); continue; }
    if(f.size>10*1024*1024){ toast(f.name+' 超过 10MB，已跳过','err'); continue; }
    p.photos.push({name:f.name, url:URL.createObjectURL(f)});
    added++;
  }
  e.target.value = '';
  execRenderPhotos();
  if(added) toast('照片已添加（'+p.photos.length+'/9）','ok');
}
function execRemovePhoto(i){
  const {p} = execCurrent();
  p.photos.splice(i,1);
  execRenderPhotos();
}
function execRenderPhotos(){
  const {p} = execCurrent();
  const box = document.getElementById('execPhotos');
  if(box) box.innerHTML = execPhotosHtml(p);
  const count = document.getElementById('photoCount');
  if(count) count.textContent = p.photos.length+'/9';
}
function execFormValues(){
  const eq = ((document.getElementById('execEq')||{}).value||'').trim();
  const ps = ((document.getElementById('execPs')||{}).value||'').trim();
  const pe = ((document.getElementById('execPe')||{}).value||'').trim();
  const people = execSelectedPeople();
  const personQty = {};
  people.forEach(n=>{
    const el = document.querySelector('#execPersonQty .person-qty-row[data-name="'+n+'"] input');
    personQty[n] = el && el.value!=='' ? Number(el.value) : null;
  });
  const qtyEl = document.getElementById('execQty');
  const qtyVal = qtyEl ? String(qtyEl.value).trim() : '';
  return {
    eq, ps, pe, people, personQty,
    qtyDone: qtyVal==='' ? null : Number(qtyVal),
    note: ((document.getElementById('execNote')||{}).value||'').trim(),
    manualReason: ((document.getElementById('execManualReason')||{}).value||'').trim()
  };
}
function execAssign(p,v){
  p.device = v.eq || '';
  p.actualPs = v.ps || null;
  p.actualPe = v.pe || null;
  p.people = v.people;
  p.personQty = v.personQty;
  p.qtyDone = v.qtyDone;
  p.note = v.note;
  p.manualReason = v.manualReason;
  if(!p.actualPs && !p.actualPe) p.manual = false;

function execApplyFormToProc(p){

}

/* =========================================================
 * 生产工序执行 · 校验与设备占用
 * ======================================================= */
/** 设备占用/时段重叠校验：全部生产任务范围内比对实际时间 */
function execDeviceConflict(p, s, e, eq){
  if(!eq) return '';
  const now = execNow();
  for(const t of execTasks){
    for(const q of t.procs){
      if(q===p) continue;
      if((q.device||q.planEq) !== eq) continue;
      if(!q.actualPs) continue;
      const qs = execParseTime(q.actualPs);
      if(qs==null) continue;
      // 已开始但未结束：设备正在占用，任何开始/保存都拦截
      if(!q.actualPe){
        return '设备「'+eq+'」正在被 '+t.code+' '+t.name+' · '+q.name+' 占用（'+q.actualPs+' 开始，未结束）';
      }
      const qe = execParseTime(q.actualPe);
      if(qe==null) continue;
      const end = e==null ? now : e;
      if(s < qe && qs < end){
        return '设备「'+eq+'」已被 '+t.code+' '+t.name+' · '+q.name+' 占用（'+q.actualPs+'–'+q.actualPe+'）';
      }
    }
  }
  return '';
}
function execValidate(t,p,v,submit){
  const s = v.ps ? execParseTime(v.ps) : null;
  const e = v.pe ? execParseTime(v.pe) : null;
  const now = execNow();
  if(v.ps && s==null) return '开始时间格式应为 HH:mm';
  if(v.pe && e==null) return '结束时间格式应为 HH:mm';
  if(s!=null && e!=null && e<=s) return '结束时间必须晚于开始时间';
  if(s!=null && s>now) return '开始时间不得晚于当前时间';
  if(e!=null && e>now) return '结束时间不得晚于当前时间';
  if(p.manual && !v.manualReason) return '手填时间必须填写原因';
  if(v.manualReason.length>200) return '手填原因不能超过 200 字';
  if(v.note.length>200) return '备注不能超过 200 字';
  if(v.qtyDone!=null && (isNaN(v.qtyDone) || v.qtyDone<=0)) return '加工数量必须大于 0';
  if(v.qtyDone!=null && Math.abs(Math.round(v.qtyDone*100)-v.qtyDone*100)>1e-6) return '加工数量最多保留两位小数';
  if(s!=null && !v.eq) return '已填写开始时间，请选择使用设备';
  if(v.eq){
    const eqObj = execEquipment.find(x=>x.name===v.eq);
    if(!eqObj) return '请从设备档案中选择使用设备';
    if(!eqObj.active && v.eq!==p.device) return '该设备已停用，不能选用';
  }
  if(s!=null){
    const idx = t.procs.indexOf(p);
    if(idx>0){
      const prev = t.procs[idx-1];
      if(!prev.actualPs) return '紧前工序「'+prev.name+'」尚未开始，不能开始本工序';
      const prevStart = execParseTime(prev.actualPs);
      if(prevStart!=null && s<prevStart) return '开始时间不得早于紧前工序「'+prev.name+'」的开始时间';
    }
    const conflict = execDeviceConflict(p,s,e,v.eq);
    if(conflict) return conflict;
  }
  if(submit){
    if(!v.ps || !v.pe) return '开始与结束时间都填写后才能提交';
    if(!v.eq) return '请选择使用设备';
    if(!v.people.length) return '请至少选择一名操作人';
    if(v.qtyDone==null || isNaN(v.qtyDone) || v.qtyDone<=0) return '请填写加工数量';
    for(const n of v.people){
      if(v.personQty[n]==null || isNaN(v.personQty[n]) || v.personQty[n]<0) return '请填写「'+n+'」的完成数量';
      if(Math.abs(Math.round(v.personQty[n]*100)-v.personQty[n]*100)>1e-6) return '「'+n+'」完成数量最多保留两位小数';
    }
    const sum = v.people.reduce((a,n)=>a+(v.personQty[n]||0),0);
    if(Math.abs(sum-v.qtyDone)>0.005) return '逐人完成数量合计（'+execNum(sum)+'）必须等于加工数量（'+execNum(v.qtyDone)+'）';
    if(p.photos.length>9) return '每道工序最多 9 张照片';
  }
  return null;
}

/* =========================================================
 * 生产工序执行 · 打点、暂存与提交
 * ======================================================= */
function execPunchStart(){
  if(!state.online){ toast('网络不可用，请恢复后继续','err'); return; }
  const {t,p} = execCurrent();
  if(p.submitted){ toast('该工序已提交，PDA 端不可修改','warn'); return; }
  if(p.actualPs){ toast('该工序已开始计时','warn'); return; }
  execApplyFormToProc(p);
  if(!p.device){ toast('请先选择使用设备','warn'); return; }
  const eqObj = execEquipment.find(x=>x.name===p.device);
  if(!eqObj){ toast('请从设备档案中选择使用设备','err'); return; }
  if(!eqObj.active){ toast('该设备已停用，不能开始计时','err'); return; }
  const idx = t.procs.indexOf(p);
  if(idx>0){
    const prev = t.procs[idx-1];
    if(!prev.actualPs){ toast('紧前工序「'+prev.name+'」尚未开始，不能开始本工序','err'); return; }
  }
  const now = execNow();
  if(idx>0){
    const prevStart = execParseTime(t.procs[idx-1].actualPs);
    if(prevStart!=null && now<prevStart){ toast('开始时间不得早于紧前工序的开始时间','err'); return; }
  }
  const conflict = execDeviceConflict(p, now, null, p.device);
  if(conflict){ toast(conflict,'err'); return; }
  p.actualPs = execFmt(now);
  p.manual = false;
  render();
  toast('已开始计时 '+p.actualPs,'ok');
}
function execPunchEnd(){
  if(!state.online){ toast('网络不可用，请恢复后继续','err'); return; }
  const {p} = execCurrent();
  if(p.submitted){ toast('该工序已提交，PDA 端不可修改','warn'); return; }
  if(!p.actualPs){ toast('请先开始计时','warn'); return; }
  if(p.actualPe){ toast('该工序已结束计时','warn'); return; }
  execApplyFormToProc(p);
  if(!p.device){ toast('请选择使用设备','warn'); return; }
  const s = execParseTime(p.actualPs);
  const now = execNow();
  if(s==null){ toast('开始时间格式不正确','err'); return; }
  if(now<=s){ toast('结束时间必须晚于开始时间','err'); return; }
  const conflict = execDeviceConflict(p, s, now, p.device);
  if(conflict){ toast(conflict,'err'); return; }
  p.actualPe = execFmt(now);
  render();
  toast('已结束计时 '+p.actualPe,'ok');
}
function execSaveDraft(){
  if(!state.online){ toast('网络不可用，请恢复后继续','err'); return; }
  const {t,p} = execCurrent();
  if(p.submitted){ toast('该工序已提交，PDA 端不可修改','warn'); return; }
  const v = execFormValues();
  const err = execValidate(t,p,v,false);
  if(err){ toast(err,'err'); return; }
  execAssign(p,v);
  render();
  toast('已暂存，可稍后继续','ok');
}
function execSubmit(){
  if(!state.online){ toast('网络不可用，请恢复后继续','err'); return; }
  const {t,p} = execCurrent();
  if(p.submitted){ toast('该工序已提交，不能重复提交','warn'); return; }
  const v = execFormValues();
  const err = execValidate(t,p,v,true);
  if(err){ toast(err,'err'); return; }
  execAssign(p,v);
  p.submitted = true;
  p.submitter = state.user.name;
  p.submitTime = execNowText();
  render();
  toast('工序已提交，PDA 端转为只读','ok');
}

/* =========================================================
 * 生产工序执行 · 记录与我的
 * ======================================================= */
function execRecordRows(){
  const rows = [];
  execTasks.forEach(t=>t.procs.forEach(p=>{ if(p.submitted) rows.push({t,p}); }));
  return rows.sort((a,b)=>String(b.p.submitTime||'').localeCompare(String(a.p.submitTime||'')));
}
function filteredExecRecordRows(){
  const f = state.execRecordFilter;
  return execRecordRows().filter(({t,p})=>{
    if(f.process!=='全部' && p.name!==f.process) return false;
    if(f.person!=='全部' && !(p.people||[]).includes(f.person)) return false;
    if(f.keyword){
      const k = f.keyword.toLowerCase();
      const hit = [t.name,t.batch,t.code,p.name,p.submitter,p.device,(p.people||[]).join('、')]
        .some(v=>String(v||'').toLowerCase().includes(k));
      if(!hit) return false;
    }
    return true;
  });
}
function execRecordListHtml(){
  const rows = filteredExecRecordRows();
  if(!rows.length) return '<div class="exec-empty">没有符合条件的提交记录</div>';
  return rows.map(({t,p})=>`
      <div class="record">
        <div class="top"><b>${esc(t.name)} · ${esc(p.name)}</b><span class="pill green">已提交</span></div>
        <div class="sub">批号 ${esc(t.batch)} · 第 ${p.seq} 道 · ${esc(t.code)}</div>
        <div class="lines">实际 ${esc(p.actualPs||'—')}–${esc(p.actualPe||'—')} · 设备 ${esc(p.device||'—')}<br/>操作人 ${esc((p.people||[]).join('、')||'—')} · 加工 ${p.qtyDone!=null?execNum(p.qtyDone):'—'} ${esc(t.unit)}<br/>提交 ${esc(p.submitter||'—')} · ${esc(p.submitTime||'—')}</div>
      </div>`).join('');
}
function onExecRecordSearch(v){
  state.execRecordFilter.keyword = v;
  const box = document.getElementById('execRecordList');
  if(box) box.innerHTML = execRecordListHtml();
  const count = document.getElementById('execRecordCount');
  if(count) count.textContent = filteredExecRecordRows().length;
}
function setExecRecordFilter(key,value){
  state.execRecordFilter[key] = value;
  const box = document.getElementById('execRecordList');
  if(box) box.innerHTML = execRecordListHtml();
  const count = document.getElementById('execRecordCount');
  if(count) count.textContent = filteredExecRecordRows().length;
}
function execRecordsView(){
  const all = execRecordRows();
  const procs = [...new Set(all.map(r=>r.p.name))];
  const people = [...new Set(all.flatMap(r=>r.p.people||[]))];
  const opts = (list,cur)=>list.map(v=>`<option ${v===cur?'selected':''}>${esc(v)}</option>`).join('');
  const rows = filteredExecRecordRows();
  return `
  <div class="appbar"><div><div class="title">提交记录</div><div class="sub">已提交工序 · ${all.length} 条</div></div></div>
  <div class="content">
    <div class="search-row">
      <input value="${esc(state.execRecordFilter.keyword)}" placeholder="搜索制剂 / 批号 / 工序 / 操作人" oninput="onExecRecordSearch(this.value)" />
    </div>
    <div class="reprint-filters">
      <select onchange="setExecRecordFilter('process',this.value)">${opts(['全部',...procs], state.execRecordFilter.process)}</select>
      <select onchange="setExecRecordFilter('person',this.value)">${opts(['全部',...people], state.execRecordFilter.person)}</select>
    </div>
    <div class="section-head"><b>已提交（<span id="execRecordCount">${rows.length}</span>）</b><span class="sub">按提交时间倒序</span></div>
    <div id="execRecordList">${execRecordListHtml()}</div>
    <div class="hint">提交后在 PDA 端只读；更正需到 PC 端生产任务详情操作并填写原因。</div>
  </div>`;
}
function execProfileView(){
  return `
  <div class="appbar"><div><div class="title">我的</div><div class="sub">账号与设备</div></div></div>
  <div class="content">
    <div class="profile-card">
      <div class="avatar">${state.user.short}</div>
      <div><b>${state.user.name}</b><div class="sub">${state.user.role} · ${state.user.dept}</div></div>
    </div>
    <div class="list-card">
      <div class="list-row" onclick="setOnline(!state.online)"><div class="ico">${icons.record}</div>网络状态<div class="arrow" style="color:${state.online?'var(--green)':'var(--red)'}">${state.online?'在线（点击模拟断网）':'离线（点击恢复网络）'} ›</div></div>
      <div class="list-row"><div class="ico">${icons.box}</div>当前设备<div class="arrow">${state.deviceRegistered?'PDA-A03':'PDA-A09（未登记）'} ›</div></div>
      <div class="list-row"><div class="ico">${icons.task}</div>作业权限<div class="arrow">工序录入 / 暂存 / 提交 ›</div></div>
      <div class="list-row" onclick="pdaLogout()"><div class="ico">${icons.user}</div>切换账号 / 角色<div class="arrow">›</div></div>
    </div>
    <div class="hint" style="margin-top:16px">仅在线作业；断网时提示并保留本机已填内容，恢复后继续。已提交工序在 PDA 端只读。</div>
  </div>`;
}

/* 扩展：work 页走独立渲染 */
const _render = render;
render = function(){
  const app = document.getElementById('app');
  if (state.screen === 'work') {
    app.innerHTML = workView();
    bindScanInput();
    setTimeout(focusScanInput, 80);
    return;
  }
  if (state.screen === 'print') { app.innerHTML = printView(); return; }
  if (state.screen === 'reprint') { app.innerHTML = reprintView(); return; }
  if (state.screen === 'execEntry') { app.innerHTML = execEntryView(); return; }
  _render();
};

render();
</script>
