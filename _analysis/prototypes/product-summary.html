(function initFilters() {
  const sel = $('fVariety');
  const seen = new Set();
  ROWS.forEach(r => {
    if (seen.has(r.preparationCode)) return;
    seen.add(r.preparationCode);
    sel.insertAdjacentHTML('beforeend', `<option value="${esc(r.preparationCode)}">${esc(r.preparationName)}（${esc(r.preparationCode)}）</option>`);
  });
})();

$('dataTime').textContent = SNAPSHOT.generatedAt ? '数据快照：' + String(SNAPSHOT.generatedAt).slice(0, 19) : '';

function contextRows(rows) {
  if (nav.level === 'batch') {
    const row = rows.find(r => r.rowId === nav.rowId);
    return row ? [row] : [];
  }
  if (nav.level === 'variety') return rows.filter(r => r.preparationCode === nav.varietyCode);
  return rows;
}

function contextLabel(rows) {
  if (nav.level === 'batch') {
    const row = rows[0] || rowById(nav.rowId);
    return row ? `当前批次：${row.wo ? row.wo.code : row.planNumber}${row.wo && row.wo.batch ? ' · 批号 ' + row.wo.batch : ''}` : '当前批次';
  }
  if (nav.level === 'variety') {
    const row = rows[0] || ROWS.find(r => r.preparationCode === nav.varietyCode);
    return row ? `当前品种：${row.preparationName}` : '当前品种';
  }
  return '';
}

function render() {
  const rows = filteredRows();
  ensureNav();
  const viewRows = contextRows(rows);
  const isBatch = nav.level === 'batch';
  const isVariety = nav.level === 'variety';

  $('stats').style.display = isBatch ? 'none' : '';
  if (!isBatch) renderStats(isVariety ? viewRows : rows);

  $('listContext').innerHTML = (state.view === 'list' && isBatch)
    ? `<div class="stats batch-stats">${slotChipsHtml(viewRows)}</div>`
    : '';
  $('listContext').classList.toggle('show', state.view === 'list' && isBatch);

  const ctx = contextLabel(viewRows);
  const ctxBtns = [];
  if (state.view === 'list' && isBatch) ctxBtns.push('<button class="mini-link" id="backContext">返回批次详情</button>');
  if (state.view === 'list' && isVariety) ctxBtns.push('<button class="mini-link" id="backContext">返回品种</button>');
  if (isBatch || isVariety) ctxBtns.push('<button class="mini-link" id="backAll">查看全部</button>');
  $('viewMeta').innerHTML = (ctx ? `<span class="ctx-label">${esc(ctx)}</span> · ` : '')
    + `共 ${viewRows.length} 条批次记录`
    + (ctxBtns.length ? ' ' + ctxBtns.join(' ') : '');
  $('cardView').classList.toggle('show', state.view === 'card');
  $('listView').style.display = state.view === 'list' ? '' : 'none';
  document.querySelectorAll('#viewSeg [data-view]').forEach(b => {
    b.classList.toggle('on', b.dataset.view === state.view);
  });
  if (state.view === 'card') {
    renderCardView(rows);
  } else {
    renderTable(viewRows);
  }
  const backAll = $('backAll');
  if (backAll) backAll.addEventListener('click', () => {
    navHome();
    render();
    window.scrollTo({top: 0, behavior: 'smooth'});
  });
  const backContext = $('backContext');
  if (backContext) backContext.addEventListener('click', () => {
    state.view = 'card';
    render();
    window.scrollTo({top: 0, behavior: 'smooth'});
  });
}

// 卡片：品种 → 工单 → 批次时间轴
$('cardView').addEventListener('click', e => {
  const exportBtn = e.target.closest('[data-export]');
  if (exportBtn) { e.stopPropagation(); exportRowById(exportBtn.dataset.export); return; }

  const filesBtn = e.target.closest('[data-files]');
  if (filesBtn) {
    e.stopPropagation();
    const row = rowById(filesBtn.dataset.files);
    if (row) openPanel(row, 'files');
    return;
  }

  const drawerAll = e.target.closest('[data-drawer-all]');
  if (drawerAll) {
    const row = rowById(drawerAll.dataset.drawerAll);
    if (row) openPanel(row, 'files');
    return;
  }

  const home = e.target.closest('[data-home]');
  if (home) { navHome(); render(); window.scrollTo({top: 0, behavior: 'smooth'}); return; }

  const variety = e.target.closest('[data-variety]');
  if (variety) { navVariety(variety.dataset.variety); render(); window.scrollTo({top: 0, behavior: 'smooth'}); return; }

  const exportVariety = e.target.closest('[data-export-variety]');
  if (exportVariety) {
    const code = exportVariety.dataset.exportVariety;
    exportRows(ROWS.filter(r => r.preparationCode === code), code);
    return;
  }

  const asset = e.target.closest('[data-asset]');
  if (asset) {
    const row = rowById(asset.dataset.asset);
    if (row) openPanel(row, 'files');
    return;
  }

  const tl = e.target.closest('[data-tl]');
  if (tl) { tl.parentElement.classList.toggle('open'); return; }

  const batch = e.target.closest('[data-batch]');
  if (batch) {
    navBatch(batch.dataset.batch);
    render();
    window.scrollTo({top: 0, behavior: 'smooth'});
  }
});

$('panelClose').addEventListener('click', () => setPanelOpen(false));
$('mask').addEventListener('click', () => setPanelOpen(false));
$('panelTabs').addEventListener('click', e => {
  const btn = e.target.closest('[data-tab]');
  if (!btn) return;
  currentTab = btn.dataset.tab;
  document.querySelectorAll('#panelTabs [data-tab]').forEach(b => b.classList.toggle('on', b === btn));
  renderPanel();
});
$('panelExport').addEventListener('click', () => {
  if (currentRow) exportRows([currentRow], currentRow.preparationName + '_' + (currentRow.wo ? currentRow.wo.batch : currentRow.planNumber));
});
$('panelBody').addEventListener('click', e => {
  const act = e.target.closest('[data-file]');
  if (act) toast('原型演示：下载 ' + act.dataset.file);
});

render();
</script>
</body>
</html>
