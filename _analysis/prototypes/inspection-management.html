<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>检验管理</title>
<style>
/* =========================================================
 * Art Design Pro 风格原型公共样式
 * 主色、灰阶与圆角对齐 C:\Work\Java\art-design-pro-main
 * =======================================================*/
:root {
  --main: #5D87FF;
  --main-light: #eef3ff;
  --success: #13deb9;
  --warning: #ffae1f;
  --danger: #ff4d4f;
  --bg: #fafbfc;
  --card: #ffffff;
  --border: rgba(0, 0, 0, .07);
  --border2: #e2e8ee;
  --g100: #f9fafb;
  --g200: #f2f4f5;
  --g300: #e6eaeb;
  --g400: #dbdfe1;
  --g500: #949eb7;
  --g600: #7987a1;
  --g700: #4d5875;
  --g800: #383853;
  --g900: #323251;
  --radius: 14px;
  --radius-md: 11px;
  --radius-sm: 8px;
  --shadow: 0 1px 2px rgba(0, 0, 0, .03);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, .08);
  --sidebar: 0px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--g900);
  font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--main); text-decoration: none; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--g400); border-radius: 4px; }

/* ---------- 侧边栏 ---------- */
.app { min-height: 100vh; }
.sidebar {
  position: fixed; left: 0; top: 0; bottom: 0; width: var(--sidebar);
  background: #fff; border-right: 1px solid var(--border);
  display: flex; flex-direction: column; z-index: 20;
}
.brand {
  display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 18px;
  border-bottom: 1px solid var(--g200); flex: none;
}
.brand-logo {
  width: 30px; height: 30px; border-radius: 9px; background: var(--main);
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; letter-spacing: .5px;
}
.brand b { font-size: 14px; font-weight: 600; color: var(--g900); letter-spacing: .3px; }
.brand span { display: block; font-size: 10px; color: var(--g500); margin-top: 1px; }
.menu { padding: 12px 10px; flex: 1; overflow: auto; }
.menu-label {
  padding: 8px 10px 5px; font-size: 10.5px; color: var(--g500);
  letter-spacing: .6px; text-transform: uppercase;
}
.menu a {
  display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 11px;
  border-radius: 9px; color: var(--g700); font-size: 13px; margin-bottom: 2px;
  transition: background .18s, color .18s;
}
.menu a:hover { background: var(--g100); color: var(--g900); }
.menu a.active { background: var(--main-light); color: var(--main); font-weight: 600; }
.menu a svg { width: 17px; height: 17px; flex: none; opacity: .85; }
.menu a.active svg { opacity: 1; }
.menu a .badge {
  margin-left: auto; height: 18px; padding: 0 6px; border-radius: 9px;
  background: var(--main); color: #fff; font-size: 10px; display: flex; align-items: center;
}
.sidebar-foot { padding: 12px 16px; border-top: 1px solid var(--g200); font-size: 10.5px; color: var(--g500); line-height: 1.6; }

/* ---------- 主区域 ---------- */
.main { max-width: 1280px; margin: 0 auto; min-height: 100vh; padding: 22px 26px 48px; }
.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.page-head h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: .2px; }
.page-head .sub { margin: 4px 0 0; font-size: 12.5px; color: var(--g600); }
.head-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

/* ---------- 按钮 ---------- */
.btn {
  height: 34px; padding: 0 14px; border-radius: var(--radius-sm); border: 1px solid var(--border2);
  background: #fff; color: var(--g700); font-size: 13px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; transition: .18s; white-space: nowrap;
}
.btn:hover { border-color: #c9d4e6; color: var(--g900); background: #fbfcfd; }
.btn-primary { background: var(--main); border-color: var(--main); color: #fff; box-shadow: 0 2px 6px rgba(93, 135, 255, .26); }
.btn-primary:hover { background: #7c9eff; border-color: #7c9eff; color: #fff; }
.btn-danger { color: var(--danger); border-color: #ffccc7; background: #fff1f0; }
.btn-danger:hover { background: #ffe7e5; border-color: #ffb3ad; color: var(--danger); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--main); }
.btn-ghost:hover { background: var(--main-light); }
.btn-sm { height: 26px; padding: 0 9px; font-size: 12px; border-radius: 6px; }
.btn[disabled], .btn.disabled { opacity: .45; cursor: not-allowed; }

/* ---------- 卡片 ---------- */
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-pad { padding: 16px 18px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 14px 18px; border-bottom: 1px solid var(--g200); }
.card-head h2 { margin: 0; font-size: 14px; font-weight: 600; color: var(--g900); }
.card-head .meta { font-size: 11.5px; color: var(--g500); }
.card-body { padding: 16px 18px; }
.mb-2 { margin-bottom: 14px; }
.mb-3 { margin-bottom: 20px; }

/* ---------- 筛选栏 ---------- */
.filters { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; padding: 12px 14px; }
.filters label { font-size: 12.5px; color: var(--g600); white-space: nowrap; }
.input, .select {
  height: 34px; border: 1px solid var(--border2); background: #fff; border-radius: var(--radius-sm);
  padding: 0 10px; font-size: 13px; color: var(--g800); outline: none; transition: .18s;
}
.input { width: 200px; }
.select { cursor: pointer; min-width: 120px; }
.input:focus, .select:focus { border-color: var(--main); box-shadow: 0 0 0 3px rgba(93, 135, 255, .12); }
.input::placeholder { color: var(--g500); }
.spacer { flex: 1; }
.checkbox { width: 15px; height: 15px; accent-color: var(--main); margin: 0; cursor: pointer; }
.check-label { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--g700); cursor: pointer; }

/* ---------- 统计 ---------- */
.stat-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
.stat-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
.stat-card .label { font-size: 12px; color: var(--g600); }
.stat-card .num { display: flex; align-items: baseline; gap: 6px; margin-top: 2px; }
.stat-card b { font-size: 24px; font-weight: 600; letter-spacing: -.3px; font-variant-numeric: tabular-nums; }
.stat-card .unit { font-size: 11.5px; color: var(--g500); }
.stat-card.warn b { color: var(--danger); }
.stat-card.ok b { color: #0eaf93; }
.stat-card.run b { color: var(--main); }

/* ---------- 表格 ---------- */
.table-wrap { overflow: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
thead th {
  background: var(--g100); color: var(--g600); font-weight: 500; text-align: left;
  padding: 10px 12px; border-bottom: 1px solid var(--g200); white-space: nowrap; font-size: 11.5px;
}
tbody td { padding: 10px 12px; border-bottom: 1px solid var(--g200); color: var(--g700); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: #f7f9ff; }
tbody tr.clickable { cursor: pointer; }
tbody tr.selected td { background: #f0f5ff; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.cell-main { color: var(--g900); font-weight: 500; }
.cell-sub { display: block; font-size: 11px; color: var(--g500); margin-top: 1px; }
.table-foot { padding: 10px 14px; border-top: 1px solid var(--g200); font-size: 12px; color: var(--g500); background: var(--g100); }
.empty { padding: 48px 20px; text-align: center; color: var(--g500); font-size: 13px; }

/* ---------- 标签 ---------- */
.tag {
  display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 5px;
  font-size: 10.5px; white-space: nowrap; background: var(--g200); color: var(--g600);
}
.tag.blue { background: #eef3ff; color: #3f6bd6; }
.tag.green { background: #e8f8f3; color: #0e8f76; }
.tag.orange { background: #fff7e6; color: #ad6800; }
.tag.red { background: #fff1f0; color: #cf1322; }
.tag.gray { background: var(--g200); color: var(--g600); }
.st { font-size: 12px; white-space: nowrap; }
.st.done { color: #0eaf93; }
.st.run { color: var(--main); }
.st.wait { color: var(--g500); }
.st.bad { color: var(--danger); }
.req-tag {
  display: inline-flex; align-items: center; height: 18px; padding: 0 5px; border-radius: 4px;
  font-size: 10px; font-weight: 600; border: 1px solid transparent; white-space: nowrap;
}
.req-tag.required { background: #fff1f0; border-color: #ffccc7; color: #a8071a; }
.req-tag.conditional { background: #fff7e6; border-color: #ffe0a3; color: #ad6800; }
.req-tag.optional { background: #fffbe6; border-color: #ffe58f; color: #8a6100; }
.req-tag.pending { background: #f2f4f5; border-color: #dbdfe1; color: #7987a1; }

/* ---------- 文件 chip ---------- */
.file-chip {
  display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px;
  border: 1px solid var(--g300); border-radius: 6px; background: #fff;
  color: var(--g600); font-size: 11px; cursor: pointer; white-space: nowrap;
}
.file-chip:hover { color: var(--main); border-color: rgba(93, 135, 255, .5); background: #f5f8ff; }
.file-chip.missing { color: #cf1322; border-color: #ffccc7; background: #fff1f0; }
.file-chip.none { color: var(--g400); border-color: transparent; background: none; cursor: default; }
.file-list { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.detail-layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 14px; align-items: start; }
.detail-side { position: sticky; top: 16px; }
.detail-main > .card { margin-bottom: 14px; }
.req-text { max-width: 280px; white-space: normal; line-height: 1.55; }
.process-layout { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 14px; align-items: start; }
.process-list { position: sticky; top: 16px; max-height: calc(100vh - 40px); display: flex; flex-direction: column; }
.process-list .list-body { overflow: auto; padding: 6px; }
.process-item { padding: 10px 11px; border-radius: 9px; cursor: pointer; border: 1px solid transparent; margin-bottom: 4px; }
.process-item:hover { background: var(--g100); }
.process-item.active { background: var(--main-light); border-color: #d6e2ff; }
.process-item .p-name { font-size: 13px; font-weight: 600; color: var(--g900); display: flex; align-items: center; gap: 6px; }
.process-item .p-meta { font-size: 11px; color: var(--g500); margin-top: 2px; }
.process-item .p-count { margin-left: auto; font-size: 10.5px; color: var(--g600); }
.editor-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.editor-head h2 { margin: 0; font-size: 17px; }
.editor-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px 14px; }
.req-table input, .req-table select { height: 30px; font-size: 12px; }
.req-table td { vertical-align: middle; }
@media (max-width: 1100px) { .process-layout { grid-template-columns: 1fr; } .process-list { position: static; max-height: none; } }
@media (max-width: 1100px) { .detail-layout { grid-template-columns: 1fr; } .detail-side { position: static; } }

/* ---------- 步骤条 / 时间轴 ---------- */
.steps { display: flex; align-items: flex-start; gap: 0; overflow: auto; padding: 4px 2px 10px; }
.steps.compact { padding: 0; gap: 4px; }
.steps.compact .step-item { min-width: 78px; }
.steps.compact .step-item::after { top: 11px; }
.steps.compact .step-dot { width: 22px; height: 22px; font-size: 10px; margin-bottom: 3px; }
.steps.compact .step-name { font-size: 10.5px; }
.steps.compact .step-count { font-size: 9.5px; }
.step-filter-row { display: flex; align-items: center; gap: 10px; padding: 8px 14px 10px; border-top: 1px solid var(--g200); flex-wrap: wrap; }
.step-filter-label { font-size: 11.5px; color: var(--g500); white-space: nowrap; }
.step-filter-row .steps { flex: 1; min-width: 0; }
.step-item { flex: 1; min-width: 110px; position: relative; text-align: center; }
.step-item::after {
  content: ""; position: absolute; top: 14px; left: 50%; width: 100%; height: 2px; background: var(--g300); z-index: 0;
}
.step-item:last-child::after { display: none; }
.step-dot {
  width: 28px; height: 28px; border-radius: 50%; background: #fff; border: 2px solid var(--g300);
  display: flex; align-items: center; justify-content: center; margin: 0 auto 6px; position: relative; z-index: 1;
  font-size: 11px; font-weight: 600; color: var(--g500);
}
.step-item.done .step-dot { border-color: var(--success); background: var(--success); color: #fff; }
.step-item.active .step-dot { border-color: var(--main); color: var(--main); box-shadow: 0 0 0 4px rgba(93, 135, 255, .12); }
.step-item.done::after { background: var(--success); }
.step-item.skip .step-dot { border-style: dashed; color: var(--g500); background: var(--g100); }
.step-item.external .step-dot { border-color: #d6e2ff; color: #3f6bd6; background: #f5f8ff; }
.step-item.external .step-name { color: #3f6bd6; }
.step-item.skip .step-name { color: var(--g500); }
.step-item .step-name { font-size: 12px; color: var(--g700); }
.step-item .step-count { font-size: 10.5px; color: var(--g500); margin-top: 1px; }
.step-item.active .step-name { color: var(--main); font-weight: 600; }

.timeline { position: relative; }
.tl-item { display: grid; grid-template-columns: 26px 1fr; gap: 12px; position: relative; padding-bottom: 14px; }
.tl-item::before {
  content: ""; position: absolute; left: 12px; top: 24px; bottom: 0; width: 2px; background: var(--g200);
}
.tl-item:last-child::before { display: none; }
.tl-dot {
  width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 2px solid var(--g300);
  display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; color: var(--g500); z-index: 1;
}
.tl-item.done .tl-dot { border-color: var(--success); background: var(--success); color: #fff; }
.tl-item.active .tl-dot { border-color: var(--main); color: var(--main); box-shadow: 0 0 0 4px rgba(93, 135, 255, .1); }
.tl-item.error .tl-dot { border-color: var(--danger); background: var(--danger); color: #fff; }
.tl-item.skip .tl-dot { border-style: dashed; color: var(--g500); background: var(--g100); }
.tl-item.external .tl-dot { border-color: #d6e2ff; color: #3f6bd6; background: #f5f8ff; }
.tl-card {
  background: #fff; border: 1px solid var(--g200); border-radius: 10px; padding: 10px 12px;
}
.tl-item.active .tl-card { border-color: rgba(93, 135, 255, .55); box-shadow: 0 4px 14px rgba(93, 135, 255, .08); }
.tl-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tl-head b { font-size: 13px; color: var(--g900); }
.tl-head .st { margin-left: auto; }
.tl-meta { font-size: 11.5px; color: var(--g500); margin-top: 3px; line-height: 1.6; }
.tl-body { margin-top: 8px; }
.tl-actions { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- 键值 / 小节 ---------- */
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px 18px; }
.kv > div { font-size: 12.5px; color: var(--g700); }
.kv .k { color: var(--g500); margin-right: 6px; }
.section-title { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--g900); }
.section-title .meta { font-size: 11.5px; color: var(--g500); font-weight: 400; }
.divider { height: 1px; background: var(--g200); margin: 16px 0; }

/* ---------- 抽屉 / 弹窗 ---------- */
.mask { position: fixed; inset: 0; background: rgba(0, 0, 0, .35); opacity: 0; pointer-events: none; transition: .2s; z-index: 30; }
.mask.show { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: 760px; max-width: 96vw; background: #fff; z-index: 31;
  transform: translateX(100%); transition: transform .24s ease; display: flex; flex-direction: column;
  box-shadow: -10px 0 30px rgba(0, 0, 0, .1);
}
.drawer.show { transform: none; }
.drawer-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 18px 20px 12px; border-bottom: 1px solid var(--g200); }
.drawer-title { font-size: 16px; font-weight: 600; color: var(--g900); }
.drawer-sub { font-size: 12px; color: var(--g600); margin-top: 3px; }
.drawer-body { flex: 1; overflow: auto; padding: 16px 20px 24px; }
.drawer-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 20px; border-top: 1px solid var(--g200); font-size: 12px; color: var(--g600); }
.icon-btn { border: 0; background: none; color: var(--g500); font-size: 18px; line-height: 1; cursor: pointer; padding: 4px 8px; border-radius: 8px; }
.icon-btn:hover { background: var(--g200); color: var(--g900); }

.modal { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -46%); width: 520px; max-width: 92vw; background: #fff; border-radius: 14px; z-index: 32; opacity: 0; pointer-events: none; transition: .2s; display: flex; flex-direction: column; max-height: 84vh; box-shadow: 0 16px 48px rgba(0, 0, 0, .14); }
.modal.show { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%); }
.modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 18px 20px 10px; }
.modal-body { padding: 0 20px 8px; overflow: auto; }
.modal-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--g200); }
.modal.step-modal { width: 820px; }
.step-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; }
.step-field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.step-field.full { grid-column: 1 / -1; }
.step-field label { font-size: 11.5px; color: var(--g600); }
.step-field label em { color: var(--danger); font-style: normal; margin-left: 2px; }
.step-field input, .step-field select, .step-field textarea {
  width: 100%; height: 32px; border: 1px solid var(--border2); border-radius: 7px;
  padding: 0 9px; font-size: 12.5px; color: var(--g800); background: #fff; outline: none;
}
.step-field textarea { height: auto; min-height: 62px; padding: 7px 9px; resize: vertical; }
.step-field input:focus, .step-field select:focus, .step-field textarea:focus {
  border-color: var(--main); box-shadow: 0 0 0 3px rgba(93, 135, 255, .12);
}
.step-field.invalid input, .step-field.invalid select, .step-field.invalid textarea { border-color: var(--danger); }
.step-field .field-error { display: none; font-size: 10.5px; color: var(--danger); }
.step-field.invalid .field-error { display: block; }
.form-section { grid-column: 1 / -1; border-top: 1px solid var(--g200); padding-top: 9px; margin-top: 2px;
  font-size: 12px; font-weight: 600; color: var(--g900); }
.form-help { font-size: 10.5px; color: var(--g500); line-height: 1.5; }
.file-input { width: 100%; font-size: 11.5px; color: var(--g600); }
.form-file-list { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.form-file-chip { display: inline-flex; align-items: center; height: 22px; padding: 0 7px; border-radius: 5px;
  background: var(--g100); border: 1px solid var(--g300); color: var(--g600); font-size: 10.5px; }
.step-view { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 18px; }
.step-view-item { min-width: 0; padding: 6px 0; border-bottom: 1px solid var(--g100); }
.step-view-item.full { grid-column: 1 / -1; }
.step-view-item .k { display: block; font-size: 10.5px; color: var(--g500); margin-bottom: 2px; }
.step-view-item .v { font-size: 12.5px; color: var(--g800); line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
.step-view-files { grid-column: 1 / -1; padding-top: 8px; }
.form-row { margin-bottom: 12px; }
.form-row label { display: block; font-size: 12px; color: var(--g600); margin-bottom: 4px; }
.form-row .input, .form-row .select, .form-row textarea { width: 100%; }
textarea.input { height: auto; min-height: 76px; padding: 8px 10px; resize: vertical; }

/* ---------- 提示 / 空状态 ---------- */
.toast {
  position: fixed; left: 50%; bottom: 30px; transform: translate(-50%, 10px); background: var(--g900); color: #fff;
  border-radius: 9px; padding: 9px 16px; font-size: 12.5px; opacity: 0; pointer-events: none; transition: .2s; z-index: 40;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.note { border-radius: 9px; padding: 9px 11px; font-size: 12px; line-height: 1.6; }

<script>
/* =========================================================
 * 页面独立脚本：Toast、抽屉、弹窗（无侧边栏）
 * =======================================================*/
(function () {
  window.toast = function (msg) {
    let el = document.getElementById('toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'toast';
      el.className = 'toast';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.classList.remove('show'); }, 1800);
  };

  window.fmtNum = function (n) {
    if (n == null || n === '') return '—';
    return Number(n).toLocaleString('zh-CN', { maximumFractionDigits: 2 });
  };

  window.openDrawer = function (id) {
    const mask = document.getElementById('mask');
    const drawer = document.getElementById(id);
    if (mask) mask.classList.add('show');
    if (drawer) drawer.classList.add('show');
  };

  window.closeDrawer = function () {
    const mask = document.getElementById('mask');
    document.querySelectorAll('.drawer.show').forEach(function (d) { d.classList.remove('show'); });
    if (mask) mask.classList.remove('show');
  };

  window.openModal = function (id) {
    const mask = document.getElementById('mask');
    const modal = document.getElementById(id);
    if (mask) mask.classList.add('show');
    if (modal) modal.classList.add('show');
  };

  window.closeModal = function () {
    document.querySelectorAll('.modal.show').forEach(function (m) { m.classList.remove('show'); });
    const mask = document.getElementById('mask');
    if (mask && !document.querySelector('.drawer.show')) mask.classList.remove('show');
  };

  document.addEventListener('click', function (e) {
    if (e.target.id === 'mask') {
      window.closeDrawer();
      window.closeModal();
    }
    if (e.target.closest('[data-close]')) {
      window.closeDrawer();
      window.closeModal();
    }
  });
})();
</script>

    g.sample = g.tasks.find(t => t.batch !== '—') || g.tasks[0];
    return g;

}
function batchStep(group) {
  const steps = group.tasks.map(currentStep);
  if (steps.every(s => s === 6)) return 6;

}
function batchConclusion(group) {
  const conclusions = group.tasks.map(t => t.inspection && t.inspection.conclusion).filter(Boolean);
  if (conclusions.includes('不合格')) return '<span class="tag red">存在不合格</span>';
  if (conclusions.length === group.tasks.length && conclusions.every(c => c === '合格')) return '<span class="tag green">全部合格</span>';
  if (conclusions.includes('合格')) return '<span class="tag orange">部分出结果</span>';
  return '<span class="tag gray">待检</span>';
}
function batchStatusTag(group) {
  if (group.tasks.some(t => t.inspection && t.inspection.conclusion === '不合格')) return '<span class="tag red">不合格</span>';
  const s = batchStep(group);
  if (s === 6) return '<span class="tag green">已完成</span>';
  if (s === 5) return '<span class="tag orange">待销毁</span>';
  if (s === 3) return '<span class="tag blue">检验中</span>';
  if (s === 4) return '<span class="tag orange">留样中</span>';
  if (s === 0) return '<span class="tag orange">待原页面请检</span>';
  return '<span class="tag gray">进行中</span>';
}
function taskChip(t) {
  const s = currentStep(t);

  return `<span class="task-chip ${cls}">${t.object} · ${stepLabel(t)}</span>`;

/* =========================================================
 * 任务派生
 * =======================================================*/
function currentStep(t) {
  if (!t.request) return 0;
  if (!t.plan || t.plan.status !== '已完成') return 1;
  if (!t.sampling) return 2;
  if (!t.inspection || t.inspection.status === '检验中') return 3;
  if (t.retentionRequired !== 0 && !t.retention) return 4;
  if (t.destructionRequired === 1 && (!t.destruction || t.destruction.status === '待销毁')) return 5;
  return 6;
}
function stepLabel(t) {
  const s = currentStep(t);
  if (s === 6) return '已完成';
  if (s === 5) return t.destructionRequired === 1 ? '销毁' : '销毁（非必）';
  if (s === 0) return '请检（原页面）';
  return STEPS[s];
}
function stepDisplayName(t, i) {
  if (i === 0) return '请检（原页面）';
  return i === 5 && t.destructionRequired === 1 ? '销毁' : STEPS[i];
}
function stepState(t, i) {
  if (i === 0) return 'external';
  const cur = currentStep(t);
  if (i === 4 && t.retentionRequired === 0) return 'skip';
  if (i === 5 && t.destructionRequired !== 1) return 'skip';
  if (cur === 6) return 'done';
  if (i < cur) return 'done';
  if (i === cur) return t.inspection && t.inspection.conclusion === '不合格' ? 'error' : 'active';
  return '';
}
function statusTag(t) {
  const s = currentStep(t);
  if (t.inspection && t.inspection.conclusion === '不合格') return '<span class="tag red">不合格</span>';
  if (s === 6) return '<span class="tag green">已完成</span>';
  if (s === 3) return '<span class="tag blue">检验中</span>';
  if (s === 4) return '<span class="tag orange">留样中</span>';
  if (s === 5) return '<span class="tag orange">待销毁</span>';
  if (s === 0) return '<span class="tag orange">待原页面请检</span>';
  return '<span class="tag gray">进行中</span>';
}
function baseRows() {
  return TASKS.filter(t => {
    if (state.batchKey && batchKey(t) !== state.batchKey) return false;
    if (state.variety && t.code !== state.variety) return false;
    if (state.object && t.object !== state.object) return false;
    if (state.keyword) {
      const hay = [t.product, t.code, t.batch, t.wo, t.planNo, t.object,
        t.plan ? t.plan.code : '', t.request ? t.request.code : '', t.inspection ? t.inspection.code : ''
      ].join(' ').toLowerCase();
      if (!hay.includes(state.keyword.trim().toLowerCase())) return false;
    }
    return true;
  });
}
function filteredTasks() {
  return baseRows();
}
function filteredGroups() {
  let groups = groupTasks(filteredTasks());
  if (state.step !== null) groups = groups.filter(g => batchStep(g) === state.step);
  return groups;
}
function filteredTaskRows() {
  let rows = filteredTasks();
  if (state.step !== null) rows = rows.filter(t => currentStep(t) === state.step);
  return rows;
}

/* =========================================================
 * 渲染

function renderStats() {
  const unit = state.mode === 'batch' ? '个批次' : '个任务';
  const counts = [0, 0, 0, 0, 0, 0, 0];
  const tasks = baseRows();
  if (state.mode === 'batch') {
    groupTasks(tasks).forEach(g => counts[batchStep(g)]++);
  } else {
    tasks.forEach(t => counts[currentStep(t)]++);
  }
  const pending = counts[0] + counts[1] + counts[2] + counts[4] + counts[5];
  document.getElementById('statGrid').innerHTML = `
    <div class="stat-card run"><div class="label">待办</div><div class="num"><b>${pending}</b><span class="unit">${unit}</span></div></div>
    <div class="stat-card run"><div class="label">检验中</div><div class="num"><b>${counts[3]}</b><span class="unit">${unit}</span></div></div>
    <div class="stat-card ok"><div class="label">已完成</div><div class="num"><b>${counts[6]}</b><span class="unit">${unit}</span></div></div>`;
}

    groupTasks(tasks).forEach(g => {
      const s = batchStep(g);
      if (s < 6) counts[s]++;
    });

    tasks.forEach(t => {
      const s = currentStep(t);

let activeTask = null;

function openInspection(id) {

function stepFiles(t, i) {

  return data && data.files ? data.files : [];
}
function stepKv(t, i) {

    if (!t.request) return [['请检单号', '未请检'], ['请检人', '—'], ['请检时间', '—'], ['检验项目', '—']];
    return [['请检单号', t.request.code], ['请检人', t.request.requester + ' · ' + t.request.dept], ['请检时间', t.request.time], ['工序 / 项目', t.request.process + ' · ' + t.request.items]];
  }
  if (i === 1) {
    if (!t.plan) return [['计划编号', '待制定'], ['检验依据', '中国药典2025版'], ['检验项目', '成品全检'], ['计划日期', '—']];
    return [['计划编号', t.plan.code], ['检验依据', t.plan.basis], ['检验项目', t.plan.items], ['计划日期', t.plan.date]];
  }
  if (i === 2) {
    if (!t.sampling) return [['取样编号', '未取样'], ['取样人', '—'], ['取样量', '—'], ['取样地点', '—']];
    return [['取样编号', t.sampling.code], ['取样人 / 时间', t.sampling.sampler + ' · ' + t.sampling.time], ['取样量 / 方法', t.sampling.quantity + ' · ' + t.sampling.method], ['取样地点', t.sampling.location]];
  }
  if (i === 3) {
    if (!t.inspection) return [['检验编号', '未检验'], ['检验人', '—'], ['检验起止', '—'], ['结论', '—']];
    return [['检验编号', t.inspection.code], ['检验人 / 复核人', t.inspection.inspector + ' / ' + t.inspection.reviewer], ['检验起止', t.inspection.start + ' ~ ' + t.inspection.end], ['检验项目', t.inspection.items], ['结论', t.inspection.conclusion]];
  }
  if (i === 4) {

    if (!t.retention) return [['留样编号', '未留样'], ['留样人', '—'], ['留样量', '—'], ['留样期限', '—']];
    return [['留样编号', t.retention.code], ['留样人 / 时间', t.retention.keeper + ' · ' + t.retention.time], ['留样量 / 地点', t.retention.quantity + ' · ' + t.retention.location], ['留样期限', t.retention.period]];

}

  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}
function nowInput() {
  const d = new Date();
  return `${todayStr()}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
function toDateTimeInput(v) {
  const text = String(v == null ? '' : v);
  if (!/^\d{4}-\d{2}-\d{2}/.test(text)) return nowInput();
  return text.replace(' ', 'T').slice(0, 16);
}
function toDateInput(v) {
  const text = String(v == null ? '' : v);
  if (!/^\d{4}-\d{2}-\d{2}/.test(text)) return todayStr();
  return text.slice(0, 10);
}
function currentMonth() {
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
}
function objectType(t) {
  if (t.object === '中间产品') return '中间产品检验';
  if (t.object === '生产原料') return '生产原料检验';
  return '成品检验';
}
function plusYearsDate(dateStr, years) {
  const d = new Date(dateStr || todayStr());
  if (Number.isNaN(d.getTime())) return dateStr || '';
  d.setFullYear(d.getFullYear() + years);
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}
function stepFields(t, i) {
  const r = t.request || {};
  const p = t.plan || {};
  const s = t.sampling || {};
  const ins = t.inspection || {};
  const ret = t.retention || {};
  const des = t.destruction || {};
  if (i === 0) {
    return [
      {key: 'inspectionCode', label: '请检单号', value: r.code || 'QJ-' + todayStr().replace(/-/g, '') + '-001', required: true},
      {key: 'requester', label: '请检人', value: r.requester || '丁圣芳', required: true},
      {key: 'requestDepartment', label: '请检部门', value: r.dept || '质量部', type: 'select', options: ['质量部', '生产部', '仓储部'], required: true},
      {key: 'requestTime', label: '请检时间', value: toDateTimeInput(r.time), type: 'datetime-local', required: true},
      {key: 'processName', label: '工序 / 检验环节', value: r.process || objectType(t), required: true},
      {key: 'configQuantity', label: '配置数量', value: r.configQuantity || fmtNum(t.qty), required: true},
      {key: 'inspectionItems', label: '检验项目', value: r.items || p.items || '性状、鉴别、水分、重量差异、装量、溶散时限、微生物限度', type: 'textarea', full: true, required: true},
      {key: 'remark', label: '备注', value: r.remark || '', type: 'textarea', full: true},
      {key: 'files', label: '附件', value: r.files || [], type: 'files', full: true}
    ];
  }
  if (i === 1) {
    return [
      {key: 'planCode', label: '计划编号', value: p.code || 'JH-' + todayStr().replace(/-/g, '') + '-001', required: true},
      {key: 'planPeriod', label: '计划周期', value: p.period || currentMonth(), required: true},
      {key: 'inspectionType', label: '检验类型', value: p.type || objectType(t), type: 'select', options: ['成品检验', '中间产品检验', '生产原料检验'], required: true},
      {key: 'objectName', label: '检验对象', value: p.objectName || t.product, required: true},
      {key: 'batchNo', label: '批号', value: p.batchNo || (t.batch === '—' ? '' : t.batch), required: true},
      {key: 'spec', label: '规格', value: p.spec || t.spec || ''},
      {key: 'inspectionSummary', label: '检验项目概要', value: p.items || '性状、鉴别、水分、重量差异、装量、溶散时限、微生物限度', type: 'textarea', full: true, required: true},
      {key: 'planTime', label: '计划日期', value: toDateInput(p.date), type: 'date', required: true},
      {key: 'remark', label: '备注', value: p.remark || '', type: 'textarea', full: true},
      {key: 'files', label: '附件', value: p.files || [], type: 'files', full: true}
    ];
  }
  if (i === 2) {
    return [
      {key: 'samplingCode', label: '取样编号', value: s.code || 'QY-' + todayStr().replace(/-/g, '') + '-001', required: true},
      {key: 'sampler', label: '取样人', value: s.sampler || '陈静', required: true},
      {key: 'samplingTime', label: '取样时间', value: toDateTimeInput(s.time), type: 'datetime-local', required: true},
      {key: 'quantity', label: '取样量', value: s.quantity || '100g×3份', required: true},
      {key: 'count', label: '取样份数', value: s.count || 3, type: 'number', required: true},
      {key: 'location', label: '取样地点', value: s.location || '成品库 A 取样间', required: true},
      {key: 'method', label: '取样方法', value: s.method || '随机', type: 'select', options: ['随机', '系统取样', '分层取样'], required: true},
      {key: 'remark', label: '备注', value: s.remark || '', type: 'textarea', full: true},
      {key: 'files', label: '附件', value: s.files || [], type: 'files', full: true}
    ];
  }
  if (i === 3) {
    return [
      {key: 'inspectionCode', label: '检验编号', value: ins.code || 'JY-' + todayStr().replace(/-/g, '') + '-001', required: true},
      {key: 'inspectionBasis', label: '检验依据', value: ins.basis || p.basis || '中国药典2025版', required: true},
      {key: 'inspectionItem', label: '检验项目', value: ins.items || p.items || '性状、鉴别、水分、重量差异、装量、溶散时限、微生物限度', type: 'textarea', full: true, required: true},
      {key: 'inspector', label: '检验人', value: ins.inspector || '丁圣芳', required: true},
      {key: 'reviewer', label: '复核人', value: ins.reviewer || '赵磊', required: true},
      {key: 'startTime', label: '开始时间', value: toDateTimeInput(ins.start), type: 'datetime-local', required: true},
      {key: 'endTime', label: '结束时间', value: toDateTimeInput(ins.end), type: 'datetime-local', required: true},
      {key: 'conclusion', label: '检验结论', value: ins.conclusion || '合格', type: 'select', options: ['合格', '不合格', '待检'], required: true},
      {key: 'remark', label: '备注', value: ins.remark || '', type: 'textarea', full: true},
      {key: 'files', label: '检验记录 / 图谱', value: ins.files || [], type: 'files', full: true}
    ];
  }
  if (i === 4) {
    return [
      {key: 'retainedCode', label: '留样编号', value: ret.code || 'LY-' + todayStr().replace(/-/g, '') + '-001', required: true},
      {key: 'keeper', label: '留样人', value: ret.keeper || '陈静', required: true},
      {key: 'quantity', label: '留样量', value: ret.quantity || (s.quantity || '100g×3份'), required: true},
      {key: 'retainedDate', label: '留样日期', value: toDateInput(ret.date || ret.time), type: 'date', required: true},
      {key: 'expiryDate', label: '留样期限', value: toDateInput(ret.expiry || (ret.period || '').replace('至', '') || plusYearsDate(ret.date || ret.time, 2)), type: 'date', required: true},
      {key: 'storageLocation', label: '存放位置', value: ret.location || '留样室 A-03', required: true},
      {key: 'observationRecord', label: '观察记录', value: ret.observation || '外观、包装、标识正常', type: 'textarea', full: true},
      {key: 'remark', label: '备注', value: ret.remark || '', type: 'textarea', full: true},
      {key: 'files', label: '附件', value: ret.files || [], type: 'files', full: true}
    ];
  }
  return [
    {key: 'destructionCode', label: '销毁编号', value: des.code || 'XH-' + todayStr().replace(/-/g, '') + '-001', required: true},
    {key: 'recordType', label: '销毁类型', value: des.recordType || '留样及稳定性考察产品销毁', required: true},
    {key: 'destroyReason', label: '销毁原因', value: des.reason || '留样到期', type: 'textarea', full: true, required: true},
    {key: 'destroyMethod', label: '销毁方式', value: des.method || '委托销毁', required: true},
    {key: 'destroyLocation', label: '销毁地点', value: des.location || '销毁区', required: true},
    {key: 'applicantName', label: '申请人', value: des.applicant || '张力', required: true},
    {key: 'applyDate', label: '申请日期', value: toDateInput(des.applyDate || des.date), type: 'date', required: true},
    {key: 'approverName', label: '批准人', value: des.approver || '赵磊', required: true},
    {key: 'approveDate', label: '批准日期', value: toDateInput(des.approveDate || des.date), type: 'date', required: true},
    {key: 'destroyerName', label: '销毁人', value: des.destroyer || des.handler || '张力', required: true},
    {key: 'destroyDate', label: '销毁日期', value: toDateInput(des.destroyDate || des.date), type: 'date', required: true},
    {key: 'supervisorName', label: '监督人', value: des.supervisor || '丁圣芳', required: true},
    {key: 'superviseDate', label: '监督日期', value: toDateInput(des.superviseDate || des.date), type: 'date', required: true},
    {key: 'remark', label: '备注', value: des.remark || '', type: 'textarea', full: true},
    {key: 'files', label: '附件', value: des.files || [], type: 'files', full: true}
  ];
}
function fieldHtml(f) {
  const id = 'sf_' + f.key;
  const label = `<label for="${id}">${esc(f.label)}${f.required ? '<em>*</em>' : ''}</label>`;
  let control = '';
  if (f.type === 'files') {
    const files = (f.value || []).map(name => `<span class="form-file-chip">${esc(name)}</span>`).join('');
    control = `<input class="file-input" id="${id}" type="file" multiple data-file-input="${f.key}" />
      <div class="form-file-list" data-file-list="${f.key}">${files}</div>
      <div class="form-help">原型演示：选择文件后只记录文件名，不实际上传。</div>`;
  } else if (f.type === 'select') {
    const options = (f.options || []).map(opt => `<option value="${esc(opt)}" ${opt === f.value ? 'selected' : ''}>${esc(opt)}</option>`).join('');
    control = `<select id="${id}" data-key="${f.key}">${options}</select>`;
  } else if (f.type === 'textarea') {
    control = `<textarea id="${id}" data-key="${f.key}" placeholder="${esc(f.placeholder || '')}">${esc(f.value)}</textarea>`;
  } else {
    control = `<input id="${id}" data-key="${f.key}" type="${f.type || 'text'}" value="${esc(f.value)}" placeholder="${esc(f.placeholder || '')}" />`;
  }
  return `<div class="step-field ${f.full ? 'full' : ''}" data-field="${f.key}">
    ${label}${control}<span class="field-error">请填写${esc(f.label)}</span>
  </div>`;
}
function openStepForm(i) {
  const t = activeTask;
  if (!t) return;
  const fields = stepFields(t, i);
  document.getElementById('stepModalTitle').textContent = `${stepDisplayName(t, i)} · ${t.product}`;
  document.getElementById('stepModalSub').textContent = `批号 ${t.batch} · ${t.wo} · ${t.object}`;
  document.getElementById('stepModalBody').innerHTML = `<form id="stepForm" class="step-form" onsubmit="return false;">
    <div class="form-section">${esc(stepDisplayName(t, i))}信息</div>
    ${fields.map(fieldHtml).join('')}
  </form>`;
  document.getElementById('stepModalFoot').innerHTML = `
    <button class="btn btn-sm" onclick="closeModal()">取消</button>
    <button class="btn btn-sm btn-primary" id="stepSubmit">保存并推进</button>`;
  document.getElementById('stepSubmit').addEventListener('click', () => submitStepForm(i, fields));
  openModal('stepModal');
}
function submitStepForm(i, fields) {
  const form = document.getElementById('stepForm');
  const values = {};
  let valid = true;
  fields.forEach(f => {
    const box = form.querySelector(`[data-field="${f.key}"]`);
    if (f.type === 'files') {
      const input = box.querySelector('input[type=file]');
      const added = input && input.files ? Array.from(input.files).map(file => file.name) : [];
      values[f.key] = [...(f.value || []), ...added];
      return;
    }
    const el = box.querySelector('input,select,textarea');
    const value = el ? String(el.value).trim() : '';
    if (f.required && !value) {
      box.classList.add('invalid');
      valid = false;
    } else {
      box.classList.remove('invalid');
    }
    values[f.key] = value;
  });
  if (!valid) {
    toast('请填写红色标记的必填项');
    return;
  }
  applyStepValues(i, values);
  closeModal();
  renderAll();
  renderDrawer();
  toast(`${stepDisplayName(activeTask, i)} 已保存${i === 3 && values.conclusion === '待检' ? '（仍为检验中）' : '，流程已推进'}`);
}
function openStepView(i) {
  const t = activeTask;
  if (!t) return;
  const fields = stepFields(t, i);
  const rows = fields.map(f => {
    if (f.type === 'files') {
      return `<div class="step-view-files"><span class="k" style="display:block;font-size:10.5px;color:var(--g500);margin-bottom:4px;">附件</span>
        <div class="form-file-list">${(f.value && f.value.length) ? f.value.map(name => `<span class="form-file-chip">${esc(name)}</span>`).join('') : '<span class="muted small">暂无附件</span>'}</div></div>`;
    }
    return `<div class="step-view-item ${f.full ? 'full' : ''}"><span class="k">${esc(f.label)}</span><span class="v">${esc(f.value) || '—'}</span></div>`;
  }).join('');
  document.getElementById('stepModalTitle').textContent = `${stepDisplayName(t, i)} · 已办理详情`;
  document.getElementById('stepModalSub').textContent = `批号 ${t.batch} · ${t.wo} · ${t.object}`;
  document.getElementById('stepModalBody').innerHTML = `<div class="step-view">${rows}</div>`;
  document.getElementById('stepModalFoot').innerHTML = `<button class="btn btn-sm" onclick="closeModal()">关闭</button>`;
  openModal('stepModal');
}
function applyStepValues(i, v) {
  const t = activeTask;
  if (!t) return;
  if (i === 0) {
    t.request = {
      code: v.inspectionCode, time: v.requestTime.replace('T', ' '), requester: v.requester,
      dept: v.requestDepartment, process: v.processName, configQuantity: v.configQuantity,
      items: v.inspectionItems, remark: v.remark, status: '已请检', files: v.files
    };
  } else if (i === 1) {
    t.plan = {
      code: v.planCode, date: v.planTime, period: v.planPeriod, type: v.inspectionType,
      objectName: v.objectName, batchNo: v.batchNo, spec: v.spec,
      basis: (t.plan && t.plan.basis) || '中国药典2025版', items: v.inspectionSummary,
      remark: v.remark, status: '已完成', files: v.files
    };
  } else if (i === 2) {
    t.sampling = {
      code: v.samplingCode, time: v.samplingTime.replace('T', ' '), sampler: v.sampler,
      quantity: v.quantity, count: v.count, location: v.location, method: v.method,
      remark: v.remark, status: '已取样', files: v.files
    };
  } else if (i === 3) {
    t.inspection = {
      code: v.inspectionCode, basis: v.inspectionBasis, items: v.inspectionItem,
      inspector: v.inspector, reviewer: v.reviewer, start: v.startTime.replace('T', ' '),
      end: v.endTime.replace('T', ' '), conclusion: v.conclusion,
      status: v.conclusion === '待检' ? '检验中' : '已检验', remark: v.remark, files: v.files
    };
  } else if (i === 4) {
    t.retention = {
      code: v.retainedCode, keeper: v.keeper, quantity: v.quantity,
      date: v.retainedDate, expiry: v.expiryDate, period: '至' + v.expiryDate,
      location: v.storageLocation, observation: v.observationRecord,
      remark: v.remark, status: '已留样', files: v.files
    };
  } else if (i === 5) {
    t.destruction = {
      code: v.destructionCode, recordType: v.recordType, reason: v.destroyReason,
      method: v.destroyMethod, location: v.destroyLocation, applicant: v.applicantName,
      applyDate: v.applyDate, approver: v.approverName, approveDate: v.approveDate,
      destroyer: v.destroyerName, destroyDate: v.destroyDate, supervisor: v.supervisorName,
      superviseDate: v.superviseDate, date: v.destroyDate, handler: v.destroyerName,
      remark: v.remark, status: '已销毁', files: v.files
    };
  }
}

/* =========================================================
 * 逐步办理
 * =======================================================*/
function advance(step) {
  const t = activeTask;
  if (!t) return;
  if (step === 0) {
    toast('请检单需在原请检页面创建，本页不发起请检');
    return;
  } else if (step === 1) {
    t.plan = { code: 'JH-' + new Date().toISOString().slice(0, 10).replace(/-/g, '') + '-001', date: '2026-11-06', basis: '中国药典2025版', items: '性状、鉴别、水分、重量差异、装量、溶散时限、微生物限度', status: '已完成', files: ['检验计划.pdf'] };
  } else if (step === 2) {
    t.sampling = { code: 'QY-20261106-001', time: '2026-11-06 10:00', sampler: '陈静', quantity: '100g×3份', location: '成品库 A 取样间', method: '随机', status: '已取样', files: ['取样记录.pdf'] };
  } else if (step === 3) {
    if (!t.inspection) t.inspection = { code: 'JY-20261106-001', inspector: '丁圣芳', reviewer: '赵磊', start: '2026-11-06 09:00', end: '2026-11-06 16:00', conclusion: '合格', items: '性状、鉴别、水分、重量差异、装量、溶散时限、微生物限度', status: '已检验', files: ['检验记录.pdf'] };
    else { t.inspection.status = '已检验'; t.inspection.conclusion = '合格'; t.inspection.end = '2026-11-06 16:00'; }
  } else if (step === 4) {
    t.retention = { code: 'LY-20261106-001', time: '2026-11-06 10:20', keeper: '陈静', quantity: '100g×3份', location: '留样室 A-08', period: '至2028-11-05', status: '已留样', files: ['留样记录.pdf'] };
  } else if (step === 5) {
    if (t.destruction) Object.assign(t.destruction, { code: 'XH-20261106-001', date: '2026-11-06', handler: '张力', status: '已销毁', files: ['销毁记录.pdf'] });
  }
  renderAll();
  renderDrawer();
  toast(STEPS[step] + ' 已办理，流程已推进');
}

/* =========================================================
 * 筛选 / 初始化
 * =======================================================*/
function renderVarietyOptions() {
  const sel = document.getElementById('fVariety');
  const seen = new Set();
  TASKS.forEach(t => {
    if (seen.has(t.code)) return;
    seen.add(t.code);
    const opt = document.createElement('option');
    opt.value = t.code;
    opt.textContent = `${t.product}（${t.code}）`;
    sel.appendChild(opt);
  });
}
function applyFilters() {
  state.variety = document.getElementById('fVariety').value;
  state.object = document.getElementById('fObject').value;
  state.keyword = document.getElementById('fKeyword').value;
  renderAll();
}
function resetFilters() {
  document.getElementById('fVariety').value = '';
  document.getElementById('fObject').value = '';
  document.getElementById('fKeyword').value = '';
  state.variety = ''; state.object = ''; state.keyword = ''; state.step = null;
  state.mode = 'batch'; state.batchKey = null;
  renderAll();
}
function clearStepFilter() { state.step = null; renderAll(); }
document.getElementById('fKeyword').addEventListener('keydown', e => { if (e.key === 'Enter') applyFilters(); });
document.querySelectorAll('#viewToggle [data-mode]').forEach(btn => {
  btn.addEventListener('click', () => setMode(btn.dataset.mode));
});

renderVarietyOptions();
renderAll();
</script>
